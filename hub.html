<style>
#c{cursor:grab}#c.grabbing{cursor:grabbing}#c.pick{cursor:pointer}
.wl{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .3s}
.wl b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:3px 7px;border-radius:5px;background:var(--board);color:var(--board-ink);white-space:nowrap}
.wl b small{color:var(--board-dim);margin-left:6px;letter-spacing:0}
.wl.locked b{background:var(--panel);color:var(--ink-2);border:1px solid var(--edge)}
.wl.soon b{background:transparent;border:1px dashed var(--edge-2);color:var(--ink-3)}
.wl i{width:1px;height:14px;background:var(--edge-2)}
#tiers{position:fixed;z-index:5;left:14px;bottom:14px;width:300px;padding:14px}
#tiers h4{font-family:var(--mono);letter-spacing:.16em;font-size:10px;color:var(--ink-2);text-transform:uppercase}
.tier{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12px}
.tier:first-of-type{border-top:0}
.tier .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.tier .dots{display:flex;gap:3px}.tier .dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}.tier .dots i.on{background:var(--accent)}.tier .dots i.av{background:var(--lamp-warn)}
#goal{position:fixed;z-index:5;left:50%;top:84px;transform:translateX(-50%);padding:8px 14px;font-size:12px;display:flex;gap:12px;align-items:center}
#goal b{color:var(--accent-ink)}
#wdetail .cta{display:flex;gap:8px;margin-top:4px}#wdetail .cta .buy{flex:1;min-height:40px;font-size:13px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px}
@media (max-width:900px){#tiers{display:none}#goal{top:auto;bottom:calc(16px + var(--sab));left:10px;right:10px;transform:none;justify-content:space-between}}
</style></head><body>
