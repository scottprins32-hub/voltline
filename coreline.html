<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Coreline — AI data centre</title>
<meta name="description" content="Coreline: a live 3D AI data centre you can run. World 08 of Voltline Worlds."><meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="kit.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2322D3EE'/%3E%3Crect x='16' y='12' width='32' height='40' rx='4' fill='%23fff'/%3E%3Crect x='20' y='18' width='24' height='4' fill='%2322D3EE'/%3E%3Crect x='20' y='28' width='24' height='4' fill='%2322D3EE'/%3E%3Crect x='20' y='38' width='24' height='4' fill='%2322D3EE'/%3E%3C/svg%3E">
<script src="meta.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import {createWorld,THREE,rnd,lerp,clamp,smooth} from './kit.js';
const racks=[],halls=[],jobs=[],packets=[],towers=[];let jobSeq=7001,done=0,doneH=0,util=0,powerMW=0,pue=1.18,tech,truck,gens,vault,heatA,heatB;
const JOB_PH=['Queued','Scheduled','Running','Checkpoint','Evaluating','Done'];
const MODELS=['llama-70b ft','vision-xl pretrain','rerank-v3','speech-asr','diffusion-sdxl','agent-eval','embed-bge','code-13b ft'];
createWorld({
 id:'coreline',num:8,name:'Coreline',tag:'AI data centre',site:'Campus C1 · 2 halls · 40 MW',accent:'#22D3EE',accentRgb:'34,211,238',accentInk:'#0e7490',
 wordmark:'Core<b>line</b>',intro:'Two GPU halls with a cutaway roof, cooling towers, a substation and a fibre vault. <b>Every finished job pays.</b> Add racks, cool smarter, bank Charter.',
 ldSteps:['closing the breakers','spinning the chillers','lighting the fibre','first job scheduled'],plantName:'NOC',productLabel:'Compute contracts',
 sky:0xe6ebf2,nightSky:0x050912,groundStops:['#e9edf3','#d5dbe4','#b8c1cd'],pal:{wall:0xeef1f5,asphalt:0xb3b9c3,floor:0xcfd5de},temps:[29,24,18,43],wx:{rain:'Monsoon',fog:'Storm · gen test',heat:'Heatwave'},particle:0x22D3EE,lamps:[[-26,0],[26,0],[0,-30]],
 overview:{t:[0,0,-4],z:50},introFrom:[-26,2,0],
 areas:{a:{num:'ST-01',label:'Hall A',t:[-26,1,0],z:18},b:{num:'ST-02',label:'Hall B',t:[26,1,0],z:18},cool:{num:'ST-03',label:'Cooling',t:[0,2,-34],z:18},power:{num:'ST-04',label:'Power',t:[-44,1,32],z:16},net:{num:'ST-05',label:'Network',t:[0,1,30],z:14}},
 kpis:[{label:'GPU utilisation'},{label:'Power draw'},{label:'PUE'}],
 products:{inf:{name:'Inference',sub:'on-demand tokens',price:350,unlock:0,unit:'per job',svg:'<path d="M6 20 16 10l6 6 8-8 8 6" stroke="currentColor" stroke-width="3" fill="none"/>'},train:{name:'Training runs',sub:'multi-node · 2.75×',price:950,unlock:150000,unit:'per job',svg:'<rect x="6" y="8" width="32" height="14" rx="2" fill="currentColor" opacity=".9"/>'},reserved:{name:'Reserved capacity',sub:'enterprise · 6×',price:2100,unlock:800000,unit:'per job',svg:'<circle cx="22" cy="15" r="9" fill="currentColor" opacity=".9"/>'}},
 upgrades:[{id:'racks',name:'More racks',fx:'+8 GPU racks per tier',cost:12000},{id:'liquid',name:'Liquid cooling',fx:'PUE −0.06 per tier · +8% price',cost:9000},{id:'sched',name:'Faster scheduler',fx:'Jobs 15% shorter per tier',cost:8000},{id:'fibre',name:'Fibre upgrade',fx:'+10% price per job',cost:10000},{id:'gen',name:'Backup generators',fx:'Storms no longer cut throughput',cost:11000},{id:'spot',name:'Spot market',fx:'+80 ⚡/s passive per tier',cost:7000},{id:'ckpt',name:'Checkpointing',fx:'Node faults lose no work',cost:9500}],
 tabs:[{id:'racks',label:'Racks',cols:['Rack','Hall','Load','Temp','Status'],rows:c=>racks.slice(0,16).map(r=>({pick:{kind:'station',id:r.id},cells:[r.name,r.hall,Math.round(r.load*100)+'%',(24+r.load*14).toFixed(0)+' °C',r.fault?'fault':r.load>.1?'running':'idle']})),meta:c=>racks.length+' racks'},
       {id:'jobs',label:'Jobs',cols:['Job','Model','GPUs','Phase','Status'],rows:c=>jobs.slice(-8).reverse().map(j=>({pick:{kind:'station',id:j.rack?j.rack.id:'vault'},cells:['#'+j.id,j.model,j.gpus,JOB_PH[j.ph],j.ph===5?'ok':j.ph>=2?'running':'queued']}))},
       {id:'inc',label:'Incidents',cols:['Unit','Task','Speed','Trips','Status'],rows:c=>c.agents.map(a=>({pick:{kind:'agent',agent:a},cells:[a.name,a.sub,(a.speed*3.6).toFixed(0)+' km/h',Math.floor(a.trips),a.status]}))}],
 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  const hall=(hx,name,id)=>{const g=new THREE.Group();g.position.set(hx,0,0);world.add(g);box(g,36,.4,28,M.floor,0,0,0);box(g,36,5,.5,M.wall,0,.4,-14);box(g,.5,5,28,M.wall,hx<0?-18:18,.4,0);box(g,36,.5,10,M.grey,0,5.4,-9);box(g,36,.3,.6,M.acc,0,5,-4);
    const h={g,name,id,racks:[],x:hx};for(let row=0;row<3;row++)for(let k=0;k<8;k++)addRack(h,-14+k*4,-8+row*8);
    const heat=new THREE.Mesh(new THREE.PlaneGeometry(34,26),new THREE.MeshBasicMaterial({color:0xff5a2c,transparent:true,opacity:0,depthWrite:false}));heat.rotation.x=-Math.PI/2;heat.position.set(0,.25,0);g.add(heat);h.heat=heat;halls.push(h);contact(44,36,hx,0,.22);addStation({id,name,type:'GPU hall · 24 racks',obj:null,pos:new THREE.Vector3(hx,3,0)});return h};
  function addRack(h,x,z){const g=new THREE.Group();g.position.set(x,0,z);h.g.add(g);box(g,2.2,4.2,1.2,M.dark,0,.4,0);const leds=[];for(let i=0;i<6;i++){const l=box(g,.12,.12,.06,M.accGlow,-.7+i*.28,1.2+(i%2)*.5,.62,{shadow:false});leds.push(l)}box(g,2.2,.1,1.2,M.mid,0,4.6,0);
    const r=addStation({id:`${h.id}-r${h.racks.length+1}`,name:`${h.id.toUpperCase()}-${String(h.racks.length+1).padStart(2,'0')}`,type:'8 × H100 · 10.4 kW',obj:g,pos:new THREE.Vector3(h.x+x,3,z),hall:h.name,load:0,leds,fault:0,job:null,wx:h.x+x,wz:z});h.racks.push(r);racks.push(r);return r}
  heatA=hall(-26,'Hall A','a');heatB=hall(26,'Hall B','b');c.addRackTo=(h)=>{const n=h.racks.length;const row=Math.floor(n/8),k=n%8;if(row>=4)return;addRack(h,-14+k*4,-8+row*8)};
  stencil('ST-01 HALL A',-26,17,10);stencil('ST-02 HALL B',26,17,10);
  // cooling towers + chillers
  for(let i=0;i<4;i++){const g=new THREE.Group();g.position.set(-24+i*16,0,-34);world.add(g);cyl(g,3.2,4,7,M.white,0,0,0,16);cyl(g,3.3,3.3,.6,M.acc,0,5.6,0,16);const fan=cyl(g,2.6,2.6,.3,M.mid,0,7,0,16);const vap=[];for(let k=0;k<5;k++){const s=sph(g,1,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.5,roughness:1}),0,8,0);s.castShadow=false;vap.push({m:s,t:k/5})}towers.push({g,fan,vap,load:0});addStation({id:'ct'+i,name:`Cooling tower ${i+1}`,type:'Evaporative · 12 MW',obj:g,pos:new THREE.Vector3(-24+i*16,4,-34)})}
  for(let i=0;i<3;i++)box(world,5,2.6,3,M.mid,-20+i*8,0,-22);stencil('ST-03 COOLING',0,-26,10);
  // substation: transformers, generators, fuel tanks
  {const g=new THREE.Group();g.position.set(-44,0,32);world.add(g);box(g,24,.3,20,M.asphalt,0,-.1,0);for(let i=0;i<2;i++){box(g,4,3.4,3,M.mid,-8+i*6,0,-6);cyl(g,.4,.4,1.4,M.white,-8+i*6,3.4,-6,10)}gens=[];for(let i=0;i<3;i++){const gen=box(g,5,2.6,2.4,M.white,-8+i*6,0,2);const stack=cyl(g,.3,.3,1.8,M.dark,-6+i*6,2.6,2,8);gens.push({gen,stack,on:false})}for(let i=0;i<2;i++){const t=cyl(g,1.4,1.4,6,M.white,-6+i*5,0,7,14);t.rotation.z=Math.PI/2;t.position.y=1.4}
    for(let i=0;i<2;i++){box(g,.3,9,.3,M.mid,7+i*4,0,-7);box(g,3,.3,.3,M.mid,7+i*4,7.5,-7)}addStation({id:'sub',name:'Substation',type:'2 × 25 MVA · 3 gensets',obj:g,pos:new THREE.Vector3(-44,3,32)});stencil('ST-04 POWER',-44,44,10)}
  // fibre vault, dock, gate, parking
  {const g=new THREE.Group();g.position.set(0,0,30);world.add(g);box(g,8,3,6,M.wall,0,0,0);box(g,8.4,.3,6.4,M.acc,0,3,0);for(let i=0;i<3;i++)box(g,.6,.6,.6,M.accGlow,-2+i*2,3.3,0,{shadow:false});vault=addStation({id:'vault',name:'Fibre entry vault',type:'4 carriers · 2 × 400G',obj:g,pos:new THREE.Vector3(0,2,30)});stencil('ST-05 NETWORK',0,37,10)}
  box(world,16,.3,10,M.asphalt,44,-.1,30);box(world,16,4,6,M.wall,44,0,36);box(world,16.4,.3,6.4,M.grey,44,4,36);box(world,6,3,.3,M.dark,44,0,33);addStation({id:'dock',name:'Loading dock',type:'Server intake · 2 bays',obj:null,pos:new THREE.Vector3(44,2,33)});
  box(world,2,2.4,2,M.white,40,0,48);box(world,.2,.3,4,M.yellow,42,1.8,48);lane(-60,48,60,48);lane(60,48,60,-50);lane(60,-50,-60,-50);lane(-60,-50,-60,48);
  for(let i=0;i<6;i++)box(world,3.4,.05,2,M.lane,20+i*4,.1,44,{shadow:false});for(const [x,z] of[[-62,-40],[62,-20],[62,20],[-62,10]])tree(x,z,1);
  // fibre lines + packets
  const L=[[0,30],[0,16],[-26,16],[-26,0]],L2=[[0,30],[0,16],[26,16],[26,0]];c.lines=[L,L2];[...L,...L2].forEach(()=>{});for(const pts of[L,L2])for(let i=0;i<pts.length-1;i++)lane(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],.06);
  for(let i=0;i<20;i++){const s=sph(world,.26,M.accGlow,0,.6,0);s.castShadow=false;packets.push({s,line:i%2,t:Math.random(),dir:i%3?1:-1})}
  // agents
  {const g=new THREE.Group();world.add(g);box(g,1.8,.6,1.2,M.white,0,.3,0);box(g,.8,1.2,1,M.acc,-.4,.9,0);for(const [dx,dz] of[[-.6,-.6],[.6,-.6],[-.6,.6],[.6,.6]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.2,10),M.tyre);w.rotation.x=Math.PI/2;w.position.set(dx,.28,dz);g.add(w)}tech=addAgent({id:'tech',name:'Tech cart',sub:'Node swap',g,pts:[[0,20],[0,20]],maxSpeed:3.5,lane:'floor',loop:false});tech.pos.set(0,20);tech.paused=true}
  {const g=new THREE.Group();world.add(g);box(g,2,2,2.2,M.acc,-2.6,.4,0);box(g,5,2.6,2.3,M.white,1.2,.4,0);for(const dx of[-2.6,.6,2.4])for(const dz of[-1.1,1.1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.3,10),M.tyre);w.rotation.x=Math.PI/2;w.position.set(dx,.45,dz);g.add(w)}truck=addAgent({id:'truck',name:'Delivery truck',sub:'New servers',g,pts:[[60,48],[44,48],[44,42],[44,48],[60,48],[60,-50],[-60,-50],[-60,48]],maxSpeed:5,lane:'road',stopAt:[2],stopTime:6})}
  {const g=new THREE.Group();world.add(g);box(g,2.8,1,1.5,M.white,0,.3,0);box(g,.6,.3,.4,M.copper,0,1.3,0);addAgent({id:'sec',name:'Security patrol',sub:'Perimeter',g,pts:[[-60,-50],[60,-50],[60,48],[-60,48]],maxSpeed:4,lane:'road'})}
 },
 apply(c){const u=c.G.up;c.pueBase=1.28-.06*u.liquid;c.priceMul=(1+.08*u.liquid)*(1+.1*u.fibre);c.schedMul=1-.15*u.sched;c.genOk=!!u.gen;c.ckpt=!!u.ckpt;c.passive=80*u.spot;const want=48+8*u.racks;while(racks.length<want){c.addRackTo(halls[racks.length%2]);if(racks.length>=80)break}},
 priceMul:c=>c.priceMul||1,rate:c=>racks.length/48*c.price(c.G.active)*(1/(c.schedMul||1))+(c.passive||0),
 tick(c,dt){const t=c.simT;const storm=c.WX.name==='Storm · gen test',hot=c.WX.name==='Heatwave';const thr=storm&&!c.genOk?.5:1;
  // job pipeline
  if(jobs.filter(j=>j.ph<5).length<racks.length/3&&Math.random()<dt*.9*thr){jobs.push({id:jobSeq++,model:MODELS[Math.floor(Math.random()*8)],gpus:[8,16,32,64][Math.floor(Math.random()*4)],ph:0,t:0,len:rnd(18,40)*(c.schedMul||1)});if(jobs.length>60)jobs.shift()}
  for(const j of jobs){if(j.ph===5)continue;j.t+=dt;if(j.ph===0&&j.t>1){const free=racks.filter(r=>!r.job&&!r.fault);if(free.length){j.rack=free[Math.floor(Math.random()*free.length)];j.rack.job=j;j.ph=1;j.t=0}}
    else if(j.ph===1&&j.t>2){j.ph=2;j.t=0}else if(j.ph===2&&j.t>j.len*.6){j.ph=3;j.t=0}else if(j.ph===3&&j.t>2){j.ph=4;j.t=0}else if(j.ph===4&&j.t>j.len*.25){j.ph=5;done++;doneH++;const v=Math.round(c.price(c.G.active)*(j.gpus/16));c.earn(v,j.rack.obj);c.log('ok',`#${j.id} ${j.model} done · ${j.gpus} GPUs`);j.rack.job=null;j.rack=null}}
  racks.forEach(r=>{const target=r.fault?0:r.job?(r.job.ph>=2&&r.job.ph<=4?.85+Math.sin(t*3+r.wx)*.1:.3):.05;r.load=lerp(r.load,target*thr,dt*2);r.leds.forEach((l,i)=>l.visible=(Math.sin(t*(4+i)+r.wx+r.wz)*.5+.5)<r.load+.1)});
  util=racks.reduce((a,r)=>a+r.load,0)/racks.length;powerMW=racks.length*10.4/1000*util*1.6+8;pue=lerp(pue,(c.pueBase||1.28)+(hot?.12:0)-util*.06,dt);
  halls.forEach(h=>{const hl=h.racks.reduce((a,r)=>a+r.load,0)/h.racks.length;h.heat.material.opacity=hl*.22});
  towers.forEach((tw,i)=>{tw.fan.rotation.y+=dt*(2+util*8+(hot?4:0));tw.vap.forEach(v=>{v.t+=dt*(.25+util*.4);if(v.t>1)v.t=0;v.m.position.y=8+v.t*7;v.m.position.x=Math.sin(v.t*5+i)*1.2;v.m.scale.setScalar(.6+v.t*2.4);v.m.material.opacity=(1-v.t)*.45*(util+.2)})});
  gens.forEach(g=>{g.on=storm;if(g.on&&Math.random()<dt*6)c.burst(g.stack,1,.2,1.5)});
  packets.forEach((p,i)=>{p.t+=dt*(.18+util*.3)*p.dir;if(p.t>1)p.t=0;if(p.t<0)p.t=1;const pts=c.lines[p.line];const seg=Math.min(pts.length-2,Math.floor(p.t*(pts.length-1)));const f=p.t*(pts.length-1)-seg;p.s.position.set(lerp(pts[seg][0],pts[seg+1][0],f),.6,lerp(pts[seg][1],pts[seg+1][1],f));p.s.visible=i<6+util*14});
  // faults + tech cart
  if(Math.random()<dt*.02){const r=racks[Math.floor(Math.random()*racks.length)];if(!r.fault){r.fault=1;if(r.job&&!c.ckpt){r.job.ph=0;r.job.rack=null;r.job=null}c.addAlert('bad',`${r.name} node fault`,'ECC errors · tech cart dispatched',{kind:'station',id:r.id});if(tech.paused){tech.target=r;tech.pts=[[tech.pos.x,tech.pos.y],[r.wx,20],[r.wx,r.wz+2]];tech.i=1;tech.dir=1;tech.paused=false;tech.sub='Swap '+r.name}}}
  if(tech.target&&Math.hypot(tech.pos.x-tech.target.wx,tech.pos.y-(tech.target.wz+2))<.8&&tech.dwell<=0&&!tech.fixing){tech.fixing=true;tech.dwell=5;tech.dwellStatus='swapping node'}
  if(tech.fixing&&tech.dwell<=0){tech.target.fault=0;c.addAlert('ok',`${tech.target.name} back online`,'Node swapped');const nxt=racks.find(r=>r.fault);tech.fixing=false;if(nxt){tech.target=nxt;tech.pts=[[tech.pos.x,tech.pos.y],[nxt.wx,20],[nxt.wx,nxt.wz+2]];tech.i=1;tech.dir=1;tech.sub='Swap '+nxt.name}else{tech.target=null;tech.pts=[[tech.pos.x,tech.pos.y],[0,20]];tech.i=1;tech.dir=1;tech.sub='Node swap'}}
  if(!tech.target&&!tech.paused&&Math.hypot(tech.pos.x,tech.pos.y-20)<.6)tech.paused=true},
 slow(c){c.kpi(0,`${(util*100).toFixed(0)}<small>%</small>`,`${jobs.filter(j=>j.ph>=2&&j.ph<5).length} jobs running · ${jobs.filter(j=>j.ph===0).length} queued`,util<.4?'warn':'');c.spark(0,util*100);c.kpi(1,`${powerMW.toFixed(1)}<small>MW</small>`,`${racks.length} racks · ${c.WX.name==='Storm · gen test'?'on generators':'grid'}`,powerMW>38?'bad':'');c.spark(1,powerMW);c.kpi(2,`${pue.toFixed(2)}`,c.WX.name==='Heatwave'?'cooling at max':'free cooling partial',pue>1.4?'bad':pue>1.3?'warn':'');c.spark(2,pue);doneH*=.97},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,stats:[['Task',a.sub],['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Trips',Math.floor(a.trips)]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.leds)return{type:s.type,status:s.fault?'fault':s.job?JOB_PH[s.job.ph].toLowerCase():'idle',level:s.fault?'bad':'',stats:[['Load',Math.round(s.load*100)+' %'],['Power',(s.load*10.4).toFixed(1)+' kW'],['Inlet temp',(24+s.load*14).toFixed(0)+' °C'],['Job',s.job?'#'+s.job.id+' '+s.job.model:'—']],bar:s.load*100};
  if(s.id.startsWith('ct'))return{type:s.type,status:'running',stats:[['Fan',Math.round(40+util*60)+' %'],['Approach','3.2 K'],['Water','recirculating']]};
  if(s.id==='sub')return{type:s.type,status:c.WX.name==='Storm · gen test'?'on generators':'grid',level:c.WX.name==='Storm · gen test'?'warn':'',stats:[['Draw',powerMW.toFixed(1)+' MW'],['Gensets',c.WX.name==='Storm · gen test'?'3 running':'standby'],['Fuel','72 h']]};
  if(s.id==='vault')return{type:s.type,status:'linked',stats:[['Traffic',(util*640).toFixed(0)+' Gb/s'],['Carriers','4'],['Latency','0.8 ms']]};
  return{type:s.type,status:'open',stats:[['Jobs done',done]]}}
});
</script></body></html>
