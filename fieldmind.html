<meta name="description" content="Fieldmind: a live 3D smart farm you can run. World 15 of Voltline Worlds."><meta name="theme-color" content="#f3f4f6">

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import {createWorld,THREE,rnd,lerp,clamp,smooth} from './kit.js';
const fields=[],cows=[];let harvester,trailer,tractor,drones=[],silo,dairy,water=0,harvested=0,stored=0,tractorField=null;
const STAGES=['Sown','Germinated','Growing','Flowering','Harvest','Stored'];
const CROPS={rice:{name:'Paddy rice',col:0x6fcf4a,ripe:0x9bd36a,yield:5.2},wheat:{name:'Wheat',col:0xb9c94a,ripe:0xe3c15a,yield:3.8},cane:{name:'Sugarcane',col:0x3f9f4f,ripe:0x7fb85a,yield:14}};
createWorld({
 id:'fieldmind',num:15,name:'Fieldmind',tag:'Smart farm',site:'Thanjavur delta · 9 plots',accent:'#84CC16',accentRgb:'132,204,22',accentInk:'#4d7c0f',
 wordmark:'Field<b>mind</b>',intro:'Nine plots of rice, wheat and sugarcane, canals, a dairy and two silos. <b>Every harvested tonne sells.</b> Irrigate smarter, add machines, bank Charter.',
 ldSteps:['reading soil sensors','charging the tractor','opening the sluices','first sowing'],plantName:'Farm office',productLabel:'Crop contracts',
 sky:0xf4f3ea,groundStops:['#efe9d6','#dccfae','#c2b08a'],pal:{wall:0xf7f0df,asphalt:0xc9bea4,floor:0xe6dcc4,water:0x6fb7c9},temps:[36,27,21,42],wx:{rain:'Monsoon',fog:'Winter mist',heat:'Harvest heat'},lamps:[[-40,-20],[30,20],[0,0]],
 overview:{t:[0,0,0],z:52},introFrom:[-20,1,-14],
 areas:{north:{num:'ST-01',label:'North fields',t:[0,0,-26],z:24},paddy:{num:'ST-02',label:'Paddy',t:[-24,0,8],z:22},dairy:{num:'ST-03',label:'Dairy',t:[44,1,-24],z:16},green:{num:'ST-04',label:'Greenhouse',t:[44,1,4],z:14},store:{num:'ST-05',label:'Storage',t:[44,2,32],z:16}},
 kpis:[{label:'Soil moisture'},{label:'Yield forecast'},{label:'Water used'}],
 products:{rice:{name:'Paddy rice',sub:'mandi price · ₹2,100/t',price:700,unlock:0,unit:'per tonne',svg:'<path d="M22 24V6M22 14c-6 0-9-4-10-9 6 0 9 4 10 9zm0-4c0-6 4-9 10-9-1 6-4 9-10 9z" fill="currentColor" opacity=".9"/>'},wheat:{name:'Wheat contract',sub:'miller offtake · +45%',price:1000,unlock:60000,unit:'per tonne',svg:'<rect x="19" y="4" width="6" height="22" rx="3" fill="currentColor" opacity=".9"/>'},cane:{name:'Sugarcane',sub:'mill gate · 2.2×',price:1550,unlock:300000,unit:'per tonne',svg:'<rect x="14" y="4" width="4" height="22" fill="currentColor"/><rect x="26" y="4" width="4" height="22" fill="currentColor"/>'}},
 upgrades:[{id:'drip',name:'Drip irrigation',fx:'Crops grow 15% faster per tier',cost:4000},{id:'harv',name:'Harvester header',fx:'Harvest 20% faster per tier',cost:6000},{id:'drone',name:'Extra drone',fx:'+1 spraying drone per tier',cost:5000},{id:'silo',name:'Silo capacity',fx:'+8% price per tonne',cost:8000},{id:'herd',name:'Dairy herd',fx:'+45 ⚡/s milk income per tier',cost:7000},{id:'sensor',name:'Soil sensors',fx:'Halves the weather penalty',cost:9000},{id:'glass',name:'Greenhouse rows',fx:'+30 ⚡/s passive per tier',cost:6500}],
 tabs:[{id:'fields',label:'Fields',cols:['Field','Crop','Stage','Moisture','Status'],rows:c=>fields.map(f=>({pick:{kind:'station',id:f.id},cells:[f.name,CROPS[f.crop].name,STAGES[f.stageIdx()],Math.round(f.moist*100)+'%',f.moist<.3?'dry':f.growth>=1?'ready':'growing']})),meta:c=>harvested.toFixed(0)+' t harvested'},
       {id:'mach',label:'Machines',cols:['Machine','Task','Speed','Trips','Status'],rows:c=>c.agents.filter(a=>!a.cow).map(a=>({pick:{kind:'agent',agent:a},cells:[a.name,a.sub,(a.speed*3.6).toFixed(0)+' km/h',Math.floor(a.trips),a.status]}))},
       {id:'live',label:'Livestock',cols:['Animal','Herd','Yield','Trips','Status'],rows:c=>cows.map(a=>({pick:{kind:'agent',agent:a},cells:[a.name,'Jersey','18 L',Math.floor(a.trips),a.status]}))}],
 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  const FW=20,FD=14;const crops=['rice','wheat','cane','rice','rice','wheat','cane','rice','wheat'];
  fields.seedRipe=4;for(let i=0;i<9;i++){const gx=(i%3)-1,gz=Math.floor(i/3)-1;const x=gx*(FW+6)-10,z=gz*(FD+6);const g=new THREE.Group();g.position.set(x,0,z);world.add(g);const crop=crops[i];const soil=new THREE.MeshStandardMaterial({color:0x8b6a3e,roughness:1});const bed=box(g,FW,.4,FD,soil,0,-.3,0);const rows=[];const mat=new THREE.MeshStandardMaterial({color:CROPS[crop].col,roughness:1});
    for(let r=0;r<7;r++){const row=box(g,FW-1.5,1,.6,mat,0,.1,-FD/2+1.3+r*(FD-2.6)/6);row.scale.y=.05;rows.push(row)}
    fields.push(addStation({id:'f'+i,name:`Plot ${String.fromCharCode(65+gz+1)}${gx+2}`,type:`${(FW*FD/100*1.6).toFixed(1)} ha · ${CROPS[crop].name}`,obj:g,pos:new THREE.Vector3(x,1,z),g,crop,rows,mat,soil,growth:i===4?1:rnd(0,.9),moist:rnd(.3,.9),x,z,sprinkler:false,stageIdx(){return this.growth>=1?4:Math.min(3,Math.floor(this.growth*4))}}))}
  // canals + pond
  for(const z of[-10,10]){const w=box(world,80,.3,1.6,M.water,-10,-.2,z,{shadow:false});w.receiveShadow=false}for(const x of[-23,3]){box(world,1.6,.3,54,M.water,x,-.2,0,{shadow:false})}
  const pond=new THREE.Mesh(new THREE.CircleGeometry(7,24),M.water);pond.rotation.x=-Math.PI/2;pond.position.set(-48,.05,34);world.add(pond);
  // roads
  lane(-56,-30,56,-30);lane(56,-30,56,40);lane(-56,40,56,40);lane(-56,-30,-56,40);
  // barn, silos, dairy, greenhouse, solar pump, palms
  {const g=new THREE.Group();g.position.set(44,0,32);world.add(g);box(g,12,6,9,new THREE.MeshStandardMaterial({color:0xb5432b,roughness:.9}),-4,0,0);box(g,12.6,.4,9.6,M.grey,-4,6,0);box(g,4,3.5,.3,M.dark,-4,0,4.6);for(const dx of[5,9]){cyl(g,2,2,9,M.white,dx,0,0,14);cyl(g,0,2.1,1.6,M.acc,dx,9,0,14)}silo=addStation({id:'silo',name:'Grain silos',type:'2 × 400 t · barn',obj:g,pos:new THREE.Vector3(44,4,32)});stencil('ST-05 STORAGE',44,42,12)}
  {const g=new THREE.Group();g.position.set(44,0,-24);world.add(g);box(g,16,4,10,M.wall,0,0,0);box(g,16.6,.4,10.6,M.grey,0,4,0);for(let k=-6;k<=6;k+=3)box(g,.3,2.4,.3,M.mid,k,0,5.2);box(g,16,.2,.3,M.acc,0,3.4,5.2);dairy=addStation({id:'dairy',name:'Dairy shed',type:'Milking parlour · 24 stalls',obj:g,pos:new THREE.Vector3(44,2,-24)});stencil('ST-03 DAIRY',44,-14,10)}
  {const g=new THREE.Group();g.position.set(44,0,4);world.add(g);box(g,14,4,8,M.glass,0,0,0,{shadow:false});for(let k=-6;k<=6;k+=2)box(g,.2,4,8,M.white,k,0,0);box(g,14,.3,8,M.white,0,4,0);for(let k=-5;k<=5;k+=2.5)box(g,1.2,.8,6,new THREE.MeshStandardMaterial({color:0x4ade80,roughness:1}),k,0,0);addStation({id:'green',name:'Greenhouse',type:'Hydroponic · 1,100 m²',obj:g,pos:new THREE.Vector3(44,2,4)});stencil('ST-04 GREENHOUSE',44,11,14)}
  {const g=new THREE.Group();g.position.set(-48,0,24);world.add(g);box(g,.4,4,.4,M.mid,0,0,0);const p=box(g,4,.15,3,new THREE.MeshStandardMaterial({color:0x1e3a5f,roughness:.3,metalness:.6}),0,4,0);p.rotation.x=-.4;box(g,1.4,1,1.4,M.dark,1.6,0,0);addStation({id:'pump',name:'Solar pump',type:'7.5 kW · pond intake',obj:g,pos:new THREE.Vector3(-48,2,24)})}
  for(const [x,z] of[[-60,-36],[62,-36],[62,46],[-60,46],[-50,-10],[-62,10],[60,20]]){const g=new THREE.Group();g.position.set(x,0,z);world.add(g);cyl(g,.25,.4,6,M.copper,0,0,0,8);for(let k=0;k<6;k++){const f=box(g,3.4,.15,.6,M.leaf,1.3,6,0);f.rotation.y=k*Math.PI/3;f.rotation.z=-.5}}
  stencil('ST-01 NORTH FIELDS',-10,-29,16);stencil('ST-02 PADDY',-36,7,10);
  // machines
  const mk=(w,h,d,col)=>{const g=new THREE.Group();world.add(g);box(g,w,h,d,col,0,.5,0);for(const [dx,dz] of[[w/3,-d/2],[w/3,d/2],[-w/3,-d/2],[-w/3,d/2]]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.4,10),M.tyre);t.rotation.x=Math.PI/2;t.position.set(dx,.5,dz);g.add(t)}return g};
  tractor=addAgent({id:'tractor',name:'Tractor T-1',sub:'Autonomous plough',g:(()=>{const g=mk(3,1.6,1.8,M.acc);box(g,1.4,1.2,1.4,M.glass,-.3,2.1,0,{shadow:false});box(g,2.2,.3,2.6,M.dark,-2.2,.6,0);return g})(),pts:[[-56,-30],[-56,40]],maxSpeed:3,lane:'farm',loop:false});
  harvester=addAgent({id:'harv',name:'Harvester H-1',sub:'Combine',g:(()=>{const g=mk(4.5,2.4,2.4,M.yellow);box(g,5,1,.8,M.dark,2.8,.4,0);box(g,1.6,1.4,1.6,M.glass,-.6,2.9,0,{shadow:false});return g})(),pts:[[56,40],[56,-30]],maxSpeed:3.5,lane:'farm',loop:false});
  trailer=addAgent({id:'trailer',name:'Grain trailer',sub:'Field → silo',g:(()=>{const g=mk(3,1,1.8,M.mid);const ld=box(g,2.6,.6,1.6,new THREE.MeshStandardMaterial({color:0xe3c15a}),0,1.5,0);ld.visible=false;g.userData.load=ld;return g})(),pts:[[56,40],[56,32]],maxSpeed:4,lane:'farm',loop:false});
  const addDrone=i=>{const g=new THREE.Group();world.add(g);box(g,1.2,.25,1.2,M.dark,0,0,0);for(const [dx,dz] of[[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.05,10),M.acc);r.position.set(dx,.25,dz);g.add(r)}const d=addAgent({id:'dr'+i,name:'Spray drone D-'+(i+1),sub:'Foliar spray',g,y:7,pts:[[-36,-14],[16,-14],[16,0],[-36,0],[-36,14],[16,14]],maxSpeed:7+i,lane:'air'+i,loop:false});d.pos.set(-36+i*20,-14+i*14);drones.push(d);return d};addDrone(0);c.addDrone=addDrone;
  for(let i=0;i<6;i++){const g=new THREE.Group();world.add(g);box(g,1.8,1.1,.9,i%2?M.white:new THREE.MeshStandardMaterial({color:0x6b4f3a}),0,.7,0);box(g,.6,.6,.5,M.dark,1.1,1.1,0);for(const [dx,dz] of[[-.6,-.3],[-.6,.3],[.6,-.3],[.6,.3]])box(g,.2,.7,.2,M.dark,dx,0,dz);const a=addAgent({id:'cow'+i,name:'Cow '+(101+i),sub:'Grazing',g,pts:[[30,-30],[30,-18],[44,-18],[44,-30]],maxSpeed:1.2+i*.1,lane:'cow',off:.3,stopAt:[1,3],stopTime:4});a.cow=true;a.pos.set(30+i*2.3,-30+(i%2)*2);a.i=1;cows.push(a)}
 },
 apply(c){const u=c.G.up;c.growMul=1+.15*u.drip;c.harvMul=1+.2*u.harv;c.priceMul=1+.08*u.silo;c.passive=45*u.herd+30*u.glass;c.sensorMul=u.sensor?.5:1;while(drones.length<1+u.drone)c.addDrone(drones.length)},
 priceMul:c=>c.priceMul||1,rate:c=>fields.length*3.5/70*c.price(c.G.active)*(c.growMul||1)+(c.passive||0),
 tick(c,dt){const t=c.simT;const rainy=c.WX.name==='Monsoon',hot=c.WX.name==='Harvest heat';
  for(const f of fields){f.moist=clamp(f.moist+dt*(rainy?.06:hot?-.03:-.012)+(f.sprinkler?dt*.05:0),0,1);f.sprinkler=f.moist<.3||(f.sprinkler&&f.moist<.6);if(f.sprinkler){water+=dt*120;if(Math.random()<dt*6)c.burst(f.obj,2,2,2)}
    f.soil.color.setHex(0xa8844e).lerp(new THREE.Color(0x5b3f22),f.moist);
    if(f.growth<1&&!f.harvesting){f.growth=Math.min(1,f.growth+dt*.01*(c.growMul||1)*(.4+f.moist)*(c.WX.name==='Winter mist'?1-.5*c.sensorMul:1))}
    const ripe=f.growth>=1;f.mat.color.setHex(CROPS[f.crop].col).lerp(new THREE.Color(CROPS[f.crop].ripe),ripe?1:f.growth*.6);f.rows.forEach((r,i)=>{if(!f.harvesting||i<f.cut)r.scale.y=lerp(r.scale.y,f.harvesting&&i<f.cut?.05:.05+f.growth*.95,dt*2)})}
  // harvester: go to a ripe field, cut rows, fill trailer
  if(!harvester.job){const f=fields.find(x=>x.growth>=1&&!x.harvesting);if(f){f.harvesting=true;f.cut=0;harvester.job=f;harvester.pts=[[harvester.pos.x,harvester.pos.y],[f.x-9,f.z-6]];harvester.i=1;harvester.dir=1;harvester.paused=false;harvester.sub='Harvesting '+f.name}}
  else{const f=harvester.job;if(!f.cutting){if(Math.hypot(harvester.pos.x-(f.x-9),harvester.pos.y-(f.z-6))<.8){f.cutting=true;harvester.pts=[];for(let r=0;r<7;r++){const z=f.z-7+1.3+r*(14-2.6)/6;harvester.pts.push(r%2?[f.x+9,z]:[f.x-9,z]);harvester.pts.push(r%2?[f.x-9,z]:[f.x+9,z])}harvester.i=1;harvester.maxSpeed=2.4*(c.harvMul||1)}}
    else{f.cut=Math.min(7,Math.floor((harvester.i)/2)+1);if(Math.random()<dt*8)c.burst(harvester.g,1,.6,1.2);if(harvester.i>=harvester.pts.length-1&&Math.hypot(harvester.pos.x-harvester.pts[harvester.pts.length-1][0],harvester.pos.y-harvester.pts[harvester.pts.length-1][1])<.8){const tonnes=(20*14/100*1.6)*CROPS[f.crop].yield;harvested+=tonnes;f.tonnes=tonnes;f.harvesting=false;f.cutting=false;f.growth=0;f.cut=0;harvester.job=null;harvester.sub='Combine';harvester.maxSpeed=3.5;c.addAlert('ok',`${f.name} harvested`,`${tonnes.toFixed(1)} t ${CROPS[f.crop].name}`,{kind:'station',id:f.id});c.earn(Math.round(tonnes*c.price(c.G.active)*.5),harvester.g);trailer.cargo=tonnes;trailer.g.userData.load.visible=true;trailer.pts=[[trailer.pos.x,trailer.pos.y],[56,trailer.pos.y],[56,36],[46,36]];trailer.i=1;trailer.dir=1;trailer.paused=false;trailer.sub='Hauling to silo'}}}
  if(trailer.cargo&&Math.hypot(trailer.pos.x-46,trailer.pos.y-36)<.8){const v=Math.round(trailer.cargo*c.price(c.G.active)*.5);c.earn(v,silo.obj);stored+=trailer.cargo;trailer.cargo=0;trailer.g.userData.load.visible=false;trailer.sub='Field → silo';trailer.pts=[[46,36],[56,36],[56,10]];trailer.i=1;trailer.dir=1}
  // tractor ploughs the field with the lowest growth that is not being harvested
  if(!tractor.job||tractor.i>=tractor.pts.length-1&&Math.hypot(tractor.pos.x-tractor.pts[tractor.pts.length-1][0],tractor.pos.y-tractor.pts[tractor.pts.length-1][1])<.8){const f=fields.filter(x=>!x.harvesting&&x.growth<.3).sort((a,b)=>a.growth-b.growth)[0]||fields[0];tractor.job=f;tractor.pts=[[tractor.pos.x,tractor.pos.y]];for(let r=0;r<5;r++){const z=f.z-6+r*3;tractor.pts.push(r%2?[f.x+9,z]:[f.x-9,z]);tractor.pts.push(r%2?[f.x-9,z]:[f.x+9,z])}tractor.i=1;tractor.dir=1;tractor.sub='Ploughing '+f.name}
  if(tractor.status==='moving'&&Math.random()<dt*4)c.burst(tractor.g,1,.4,.6);
  drones.forEach(d=>{if(d.status==='moving'&&Math.random()<dt*3)c.burst(d.g,1,.3,.2)});
  cows.forEach(cw=>{if(cw.dwell>0&&Math.hypot(cw.pos.x-44,cw.pos.y+18)<3)cw.dwellStatus='milking'})},
 slow(c){const m=fields.reduce((a,f)=>a+f.moist,0)/9*100;c.kpi(0,`${m.toFixed(0)}<small>%</small>`,`${fields.filter(f=>f.sprinkler).length} sprinklers on`,m<35?'bad':m<50?'warn':'');c.spark(0,m);const yf=fields.reduce((a,f)=>a+(20*14/100*1.6)*CROPS[f.crop].yield*(.5+.5*f.growth),0);c.kpi(1,`${yf.toFixed(0)}<small>t</small>`,`${harvested.toFixed(0)} t harvested · ${stored.toFixed(0)} t stored`,'');c.spark(1,yf);c.kpi(2,`${c.fmt(water)}<small>L</small>`,c.WX.name==='Monsoon'?'rain-fed today':'pumped from pond',water>200000?'warn':'');c.spark(2,water/1000)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.cow?'Jersey · 18 L/day':a.sub,status:a.status,level:a.status==='yielding'?'warn':'',stats:[['Task',a.sub],['Speed',(a.speed*3.6).toFixed(1)+' km/h'],['Trips',Math.floor(a.trips)],['Load',a===trailer?(a.cargo?a.cargo.toFixed(1)+' t':'empty'):'—']]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.rows)return{type:s.type,status:s.harvesting?'harvesting':s.growth>=1?'ready to harvest':STAGES[s.stageIdx()].toLowerCase(),level:s.moist<.3?'warn':'',stats:[['Crop',CROPS[s.crop].name],['Stage',STAGES[s.stageIdx()]],['Soil moisture',Math.round(s.moist*100)+' %'],['Yield est.',((20*14/100*1.6)*CROPS[s.crop].yield).toFixed(1)+' t'],['Sprinkler',s.sprinkler?'on':'off']],bar:s.growth*100};
  if(s.id==='silo')return{type:s.type,status:'receiving',stats:[['Stored',stored.toFixed(0)+' t'],['Capacity',(800+100*c.G.up.silo)+' t'],['Price',c.fmt(c.price(c.G.active))+' ⚡/t']],bar:stored%800/8};
  if(s.id==='dairy')return{type:s.type,status:'milking',stats:[['Herd',cows.length+(c.G.up.herd*12)],['Milk today',(cows.length+c.G.up.herd*12)*18+' L'],['Income',(45*c.G.up.herd)+' ⚡/s']]};
  return{type:s.type,status:'running',stats:[['Output','nominal']]}}
});
</script></body></html>
