  addStation({id:'gs1',name:'Main grandstand',type:'12,000 seats',obj:stand(0,-36,0,56),pos:new THREE.Vector3(0,4,-40)});addStation({id:'gs2',name:'Hairpin grandstand',type:'6,000 seats',obj:stand(66,4,-Math.PI/2,30),pos:new THREE.Vector3(70,4,4)});stencil('SECTOR 03 HAIRPIN',52,0,10,0,'#9aa3b2');
  {const g=new THREE.Group();world.add(g);const p=curve.getPointAt(.57),t=curve.getTangent(.57);g.position.copy(p);g.rotation.y=-Math.atan2(t.z,t.x);box(g,26,.6,.6,M.wall,0,5.4,-6.5);box(g,26,.6,.6,M.wall,0,5.4,6.5);box(g,26,.5,14,M.wall,0,5.9,0);box(g,26,6,.8,new THREE.MeshStandardMaterial({color:0xcbbfae,roughness:1}),0,0,-6.9);addStation({id:'tun',name:'Marina tunnel',type:'180 m · lit',obj:g,pos:new THREE.Vector3(p.x,3,p.z)});stencil('SECTOR 04 TUNNEL',p.x,p.z+12,10,0,'#9aa3b2')}
  {const sea=new THREE.Mesh(new THREE.PlaneGeometry(70,30),M.water);sea.rotation.x=-Math.PI/2;sea.position.set(-20,.03,56);world.add(sea);for(let i=0;i<5;i++){box(world,3,.8,1.2,M.white,-40+i*9,0,52);box(world,.15,3,.15,M.mid,-40+i*9,.8,52)}addStation({id:'marina',name:'Marina',type:'Yacht berths · hospitality',obj:null,pos:new THREE.Vector3(-20,1,54)})}

  for(let i=0;i<6;i++){const u=.1+i*.15;const p=curve.getPointAt(u),t=curve.getTangent(u);const n=new THREE.Vector3(-t.z,0,t.x);const g=new THREE.Group();g.position.set(p.x+n.x*13,0,p.z+n.z*13);world.add(g);box(g,.6,1.4,.5,M.acc,0,0,0);sph(g,.25,M.dark,0,1.75,0);const flag=box(g,.1,1,.7,M.yellow,.5,1.2,0);flag.visible=false;marshals.push({g,flag,u})}
  {const g=new THREE.Group();world.add(g);box(g,3.8,1,1.7,M.white,0,.3,0);box(g,1.8,.7,1.5,M.glass,-.1,1.3,0,{shadow:false});box(g,1,.3,1.6,new THREE.MeshStandardMaterial({color:0xf59e0b,emissive:0xf59e0b,emissiveIntensity:1.5}),0,2,0,{shadow:false});g.visible=false;safetyCar=g}
  addAgent({id:'med',name:'Medical car',sub:'Standby · pit exit',g:(()=>{const g=new THREE.Group();world.add(g);box(g,3.8,1.2,1.7,M.yellow,0,.3,0);box(g,.8,.3,1.4,new THREE.MeshStandardMaterial({color:0xef4444,emissive:0xef4444,emissiveIntensity:1.5}),0,1.6,0,{shadow:false});return g})(),pts:[[-32,-20],[32,-20]],maxSpeed:5,lane:'pit',loop:false});
  c.carPos=(u,lat)=>{const p=curve.getPointAt(u),t=curve.getTangent(u);return[p.x-t.z*lat,p.z+t.x*lat,-Math.atan2(t.z,t.x)]};
 },
 apply(c){const u=c.G.up;c.priceMul=1+.1*u.stand;c.pitMul=1-.25*u.pit;c.drs=1+.08*u.drs;c.lightsOk=!!u.lights;c.passive=70*u.hosp+40*u.marina;c.surfMul=u.surface?.5:1},
 priceMul:c=>(c.priceMul||1)*((c.nightT>.5&&!c.lightsOk)?.6:1),rate:c=>20*c.price(c.G.active)/16*(c.drs||1)+(c.passive||0),
 tick(c,dt){raceT+=dt;const wet=c.WX.name==='Light rain'?1-.15*c.surfMul:c.WX.name==='Heavy rain'?1-.45*c.surfMul:1;const scMul=safety>0?.45:1;
  trackT=lerp(trackT,(c.WX.name==='Sunset heat'?46:c.WX.name==='Light rain'||c.WX.name==='Heavy rain'?22:34)-c.nightT*8,dt*.05);
  const order=cars.slice().sort((a,b)=>b.dist-a.dist);
  for(const k of cars){k.lapT+=dt;
    if(k.pitting){k.stopT+=dt;if(k.stopT>3*(c.pitMul||1)+8){k.pitting=false;k.stops++;k.tyre=k.tyre==='medium'?'hard':'medium';pitLaps++}k.v=lerp(k.v,0,dt*2);const [x,z,h]=c.carPos(k.u,0);k.g.position.set(lerp(x,-20+k.stops*0,0),0,-20);k.g.position.x=lerp(k.g.position.x,-10+(cars.indexOf(k)%10)*2-10,dt);k.g.rotation.y=0;k.pos.set(k.g.position.x,1,-20);continue}
    const t1=curve.getTangent(k.u),t2=curve.getTangent((k.u+.01)%1);const curv=t1.distanceTo(t2);const vTarget=k.vmax*(1-clamp(curv*2.2,0,.55))*wet*scMul*(c.drs||1)*(k.spun>0?.2:1);
    // car ahead: slipstream boost, or back off if too close
    const ahead=cars.filter(o=>o!==k&&!o.pitting&&((o.u-k.u+1)%1)<.03&&((o.u-k.u+1)%1)>0&&Math.abs(o.lat-k.lat)<1.5).sort((a,b)=>((a.u-k.u+1)%1)-((b.u-k.u+1)%1))[0];
    let vt=vTarget;if(ahead){const gap=((ahead.u-k.u+1)%1)*LEN;if(gap<4)vt=Math.min(vt,ahead.v*.95);else if(gap<10&&k.vmax>ahead.vmax&&curv<.05){vt*=1.04;k.lat=lerp(k.lat,-ahead.lat,dt*2)}}
    k.v=lerp(k.v,vt,dt*(k.v<vt?.9:3));k.lat=lerp(k.lat,(cars.indexOf(k)%2?1:-1)*1.6+Math.sin(k.u*40)*.4,dt*.5);
    const du=k.v*dt/LEN;k.u+=du;k.dist+=du*LEN;if(k.spun>0)k.spun-=dt;

    const [x,z,h]=c.carPos(k.u,k.lat);k.g.position.set(x,0,z);k.g.rotation.y=h+(k.spun>0?k.spun*6:0);k.pos.set(x,1,z);if(k.v>20&&(c.WX.name==='Light rain'||c.WX.name==='Heavy rain')&&Math.random()<dt*10)c.burst(k.g,1,.5,.6)}
  if(safety<=0&&Math.random()<dt*.004*(c.WX.name==='Heavy rain'?4:1)){const k=cars[Math.floor(Math.random()*20)];k.spun=2;safety=25;incidents++;c.addAlert('bad',`${k.driver} off at turn ${1+Math.floor(k.u*14)}`,'Safety car deployed',{kind:'station',id:k.id});safetyCar.visible=true;safetyCar.userData.u=order[0].u-.02}
  if(safety>0){safety-=dt;safetyCar.userData.u=(safetyCar.userData.u+dt*12/LEN)%1;const [x,z,h]=c.carPos(safetyCar.userData.u,0);safetyCar.position.set(x,0,z);safetyCar.rotation.y=h;if(safety<=0){safetyCar.visible=false;c.addAlert('ok','Safety car in','Racing resumes')}}
  marshals.forEach(m=>{const near=cars.some(k=>k.spun>0&&Math.abs(k.u-m.u)<.08);m.flag.visible=near||safety>0;if(m.flag.visible)m.flag.rotation.x=Math.sin(raceT*8)*.5});
  if(lap>=TOTAL&&order[0].dist/LEN>=TOTAL){c.addAlert('ok',`Chequered flag · ${order[0].driver} wins`,order[0].team);cars.forEach(k=>{k.dist=k.u*LEN-cars.indexOf(k)*.012*LEN;k.stops=0;k.pitAt=8+Math.floor(cars.indexOf(k)/4)*3});lap=1;fastest=999}},
 slow(c){c.kpi(0,`${lap}<small>/ ${TOTAL}</small>`,safety>0?'safety car · delta positive':`leader ${cars.slice().sort((a,b)=>b.dist-a.dist)[0].driver}`,safety>0?'warn':'');c.spark(0,lap);c.kpi(1,fastest<999?`${fastest.toFixed(2)}<small>s</small>`:'—',fastest<999?cars.find(k=>k.best===fastest)?.driver||'':'no flying lap yet','');c.spark(1,fastest<999?fastest:0);c.kpi(2,`${trackT.toFixed(0)}<small>°C</small>`,c.WX.name,trackT>44?'warn':'');c.spark(2,trackT)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,stats:[['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Trips',Math.floor(a.trips)]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.driver){const pos=cars.slice().sort((a,b)=>b.dist-a.dist).indexOf(s)+1;const lead=cars.slice().sort((a,b)=>b.dist-a.dist)[0];return{type:s.team,status:s.pitting?'in pit lane':s.spun>0?'spun':'racing',level:s.spun>0?'bad':s.pitting?'warn':'',stats:[['Position','P'+pos],['Gap to leader',s===lead?'leader':((lead.dist-s.dist)/Math.max(1,s.v)).toFixed(1)+' s'],['Speed',(s.v*9).toFixed(0)+' km/h'],['Last lap',s.last?s.last.toFixed(2)+' s':'—'],['Tyre',s.tyre],['Stops',s.stops]],bar:s.u*100}}
