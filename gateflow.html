 priceMul:c=>(c.priceMul||1)*((c.nightT>.5&&!c.nightOk)?.6:1),rate:c=>planes.length*c.price(c.G.active)/(260*(c.turnMul||1))+(c.passive||0),

 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,level:a.status==='yielding'?'warn':'',stats:[['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Trips',Math.floor(a.trips)],['Yields',a.yield]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.gear)return{type:s.type,status:s.state==='turn'?s.phaseName:s.state,level:s.state==='turn'?'':'',stats:[['Flight',s.flight],['Registration',s.reg],['Pax',s.pax],['Fuel',s.fuel.toFixed(1)+' t'],['Altitude',Math.round(s.y*30)+' ft'],['Stand',s.stand?stands.indexOf(s.stand)+1:'—']],bar:s.state==='turn'?(s.phase+1)/6*100:null};
  if(s.x!==undefined&&s.name.startsWith('Stand'))return{type:s.type,status:s.plane?'occupied':'open',stats:[['Aircraft',s.plane?s.plane.reg:'—'],['Phase',s.plane?s.plane.phaseName:'—'],['Bridge','docked'],['GPU','400 Hz on']]};
  return{type:s.type,status:'open',stats:[['Movements today',movements],['Shift','A']]}}
});
