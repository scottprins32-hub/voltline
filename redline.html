<script type="module">

const modules=[],rovers=[],crew=[],devils=[];let o2=78,power=0,eva=0,ice=0,water=4200,lander,landerState='cruise',landerT=-30,sol=1412,landings=0,greenhouse,mine,oxy,padSt,solarArr=[],habs=[];
const PH=['Launched','Cruise','Entry','Landing','Unloading','Stored'];
createWorld({
 id:'redline',num:12,name:'Redline',tag:'Mars colony base',site:'Jezero crater · Sol 1412',accent:'#14B8A6',accentRgb:'20,184,166',accentInk:'#0f766e',
 wordmark:'Red<b>line</b>',intro:'Habitat domes, a glowing greenhouse, an ice mine, an oxygen plant and a landing pad in a crater. <b>Every tonne of oxygen and water you produce pays the programme.</b> Grow the colony, bank Charter.',
 ldSteps:['pressurising the domes','waking the rovers','pointing the dish at Earth','first EVA'],plantName:'Colony command',productLabel:'Programme contracts',
 sky:0xe8c7a8,nightSky:0x120a0e,groundStops:['#d98a5a','#c2723f','#9e5a30'],pal:{wall:0xf1e6da,asphalt:0xb06a42,floor:0xd3a07c,white:0xf6efe8},temps:[-20,-60,-80,5],wx:{rain:'Dust storm',fog:'Frost dawn',heat:'Clear sol'},particle:0xffe8c8,lamps:[[0,0],[-30,10],[30,-10]],

 products:{o2:{name:'Oxygen supply',sub:'programme rate · per kg',price:80,unlock:0,unit:'per kg O₂',svg:'<circle cx="22" cy="15" r="9" fill="currentColor" opacity=".9"/>'},fuel:{name:'Methalox production',sub:'return propellant · 2.3×',price:190,unlock:80000,unit:'per kg',svg:'<path d="M22 4c6 6 8 14 4 24h-8c-4-10-2-18 4-24z" fill="currentColor" opacity=".9"/>'},science:{name:'Science return',sub:'sample programme · 6×',price:480,unlock:420000,unit:'per kg',svg:'<rect x="8" y="8" width="28" height="14" rx="3" fill="currentColor" opacity=".9"/>'}},
 upgrades:[{id:'rover',name:'Extra rover',fx:'+1 ice rover per tier',cost:6000},{id:'solar',name:'Solar array',fx:'+1 array row · more power per tier',cost:7000},{id:'moxie',name:'Oxygen plant stack',fx:'O₂ output +25% per tier',cost:9000},{id:'dome',name:'New habitat dome',fx:'+2 crew per tier',cost:11000},{id:'green',name:'Greenhouse racks',fx:'+40 ⚡/s passive per tier',cost:6500},{id:'nuke',name:'Fission reactor',fx:'Dust storms no longer cut power',cost:14000},{id:'dish',name:'Deep-space dish',fx:'+10% per kg delivered',cost:8000}],
 tabs:[{id:'mods',label:'Modules',cols:['Module','Pressure','Temp','Power','Status'],rows:c=>modules.map(m=>({pick:{kind:'station',id:m.id},cells:[m.name,(m.kpa||101).toFixed(0)+' kPa',m.temp+' °C',m.kw+' kW',m.status]})),meta:c=>`sol ${sol}`},
       {id:'rovers',label:'Rovers',cols:['Rover','Task','Load','Trips','Status'],rows:c=>rovers.map(r=>({pick:{kind:'agent',agent:r},cells:[r.name,r.sub,r.load?'ice 180 kg':'empty',Math.floor(r.trips),r.status]}))},
       {id:'crew',label:'Crew',cols:['Crew','Role','Location','Suit','Status'],rows:c=>crew.map(k=>({pick:{kind:'agent',agent:k},cells:[k.name,k.role,k.status==='loading'?'airlock':'outside',k.suit+'%',k.status==='moving'?'on EVA':'airlock']}))}],
 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  // crater rim + rocks + dunes
  for(let i=0;i<22;i++){const a=i/22*Math.PI*2;const r=78+rnd(-6,6);const m=new THREE.Mesh(new THREE.ConeGeometry(rnd(10,18),rnd(8,16),6),new THREE.MeshStandardMaterial({color:0xa8572f,roughness:1,flatShading:true}));m.position.set(Math.cos(a)*r,-2,Math.sin(a)*r*.8);m.castShadow=true;m.receiveShadow=true;world.add(m)}
  for(let i=0;i<30;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(.5,2),0),new THREE.MeshStandardMaterial({color:0x8f4a28,roughness:1,flatShading:true}));m.position.set(rnd(-70,70),.2,rnd(-60,60));m.castShadow=true;world.add(m)}
  for(let i=0;i<6;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(rnd(6,12),10,6),new THREE.MeshStandardMaterial({color:0xcf8a5c,roughness:1,flatShading:true}));d.scale.y=.18;d.position.set(rnd(-60,60),-.2,rnd(-50,50));d.receiveShadow=true;world.add(d)}
  // habitat domes + tubes
  const dome=(id,name,type,x,z,r,col,kw)=>{const g=new THREE.Group();g.position.set(x,0,z);world.add(g);const d=new THREE.Mesh(new THREE.SphereGeometry(r,20,10,0,Math.PI*2,0,Math.PI/2),col||M.white);d.castShadow=true;d.receiveShadow=true;g.add(d);cyl(g,r+.4,r+.6,.8,M.mid,0,0,0,20);const w=box(g,.6,.6,.2,M.window,0,r*.5,r*.86,{shadow:false});w.userData.win=1;contact(r*3,r*3,x,z,.2);const m=addStation({id,name,type,obj:g,pos:new THREE.Vector3(x,r,z),dome:d,temp:21,kw,status:'nominal',kpa:101});modules.push(m);return m};
  habs=[dome('hab1','Habitat A','Living quarters · 4 crew',0,0,7,null,6),dome('hab2','Habitat B','Lab and medical',14,-4,6,null,8),dome('hab3','Habitat C','Workshop',-12,-6,6,null,7)];
  const tube=(a,b)=>{const L=Math.hypot(b.x-a.x,b.z-a.z);const t=cyl(world,1.3,1.3,L,M.white,(a.x+b.x)/2,0,(a.z+b.z)/2,10);t.rotation.z=Math.PI/2;t.rotation.y=-Math.atan2(b.z-a.z,b.x-a.x);t.position.y=1.3};tube(habs[0].pos,habs[1].pos);tube(habs[0].pos,habs[2].pos);
  greenhouse=dome('green','Greenhouse','Hydroponics · 220 m²',-26,10,7,new THREE.MeshStandardMaterial({color:0xbfffe6,transparent:true,opacity:.55,emissive:0x14B8A6,emissiveIntensity:.5}),12);tube(habs[2].pos,greenhouse.pos);stencil('ST-02 GREENHOUSE',-26,21,12,0,'#7a3b1f');
  stencil('ST-01 HABITAT · JEZERO BASE',0,12,22,0,'#7a3b1f');
  // oxygen plant, ice mine, solar arrays, rover garage, landing pad, comms
  {const g=new THREE.Group();g.position.set(18,0,14);world.add(g);box(g,8,4,6,M.white,0,0,0);for(let k=0;k<3;k++)cyl(g,.5,.5,2.4,M.mid,-2+k*2,4,0,8);box(g,8.4,.4,6.4,M.acc,0,4.2,0);oxy=addStation({id:'oxy',name:'Oxygen plant',type:'MOXIE stack · 24 kg/sol',obj:g,pos:new THREE.Vector3(18,2,14),temp:800,kw:14,status:'running'});modules.push(oxy)}
  {const g=new THREE.Group();g.position.set(40,0,-30);world.add(g);box(g,.6,10,.6,M.mid,-3,0,-3);box(g,.6,10,.6,M.mid,3,0,-3);box(g,.6,10,.6,M.mid,0,0,3);box(g,7,.6,.6,M.acc,0,10,-3);const drill=cyl(g,.4,.4,9,M.dark,0,.5,0,8);g.userData.drill=drill;const pit=new THREE.Mesh(new THREE.CircleGeometry(5,20),new THREE.MeshStandardMaterial({color:0x6b3a1f,roughness:1}));pit.rotation.x=-Math.PI/2;pit.position.y=.08;g.add(pit);box(g,3,2,3,M.white,7,0,0);mine=addStation({id:'mine',name:'Ice mining rig','type':'Subsurface ice · 3 m',obj:g,pos:new THREE.Vector3(40,4,-30),temp:-55,kw:9,status:'drilling'});modules.push(mine);stencil('ST-03 ICE MINE',40,-20,10,0,'#7a3b1f')}
  c.addArray=()=>{const row=solarArr.length;const g=new THREE.Group();g.position.set(-36,0,-30+row*6);world.add(g);for(let k=0;k<6;k++){box(g,.25,1.4,.25,M.mid,-10+k*4,0,0);const p=box(g,3.8,.12,2.6,new THREE.MeshStandardMaterial({color:0x1e3a5f,roughness:.3,metalness:.6}),-10+k*4,1.4,0);p.rotation.x=-.4}solarArr.push(g)};for(let i=0;i<3;i++)c.addArray();addStation({id:'solar',name:'Solar field','type':'Thin-film arrays',obj:null,pos:new THREE.Vector3(-36,1,-24),temp:-40,kw:0,status:'generating'});stencil('ST-04 POWER',-36,-10,8,0,'#7a3b1f');
  {const g=new THREE.Group();g.position.set(0,0,-28);world.add(g);box(g,12,4.5,8,M.white,0,0,0);box(g,12.6,.4,8.6,M.acc,0,4.5,0);box(g,8,3.6,.3,M.dark,0,0,4.1);addStation({id:'garage',name:'Rover garage','type':'2 bays · battery swap',obj:g,pos:new THREE.Vector3(0,2,-28),temp:5,kw:4,status:'nominal'})}
  {const g=new THREE.Group();g.position.set(36,0,34);world.add(g);cyl(g,9,9.5,.5,M.asphalt,0,0,0,24);const ring=new THREE.Mesh(new THREE.TorusGeometry(7.5,.25,8,40),M.accGlow);ring.rotation.x=Math.PI/2;ring.position.y=.6;g.add(ring);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;box(g,.4,.5,.4,M.accGlow,Math.cos(a)*8.5,.5,Math.sin(a)*8.5,{shadow:false})}padSt=addStation({id:'pad',name:'Landing pad','type':'Supply landers · 12 t',obj:g,pos:new THREE.Vector3(36,1,34),temp:-30,kw:1,status:'clear'});stencil('ST-05 LANDING PAD',36,46,12,0,'#7a3b1f')}
  {const g=new THREE.Group();g.position.set(-14,0,-40);world.add(g);cyl(g,.3,.4,6,M.mid,0,0,0,8);const dish=new THREE.Mesh(new THREE.ConeGeometry(3,1.2,20,1,true),new THREE.MeshStandardMaterial({color:0xffffff,side:THREE.DoubleSide}));dish.position.y=6.6;dish.rotation.x=-.7;g.add(dish);g.userData.dish=dish;box(g,.3,4,.3,M.mid,0,0,-3);addStation({id:'comms',name:'Comms antenna','type':'X-band · DSN link',obj:g,pos:new THREE.Vector3(-14,4,-40),temp:-50,kw:2,status:'linked'})}
  // lander
  lander=new THREE.Group();world.add(lander);cyl(lander,2.2,2.2,6,M.white,0,1.5,0,12);cyl(lander,0,2.2,2,M.acc,0,7.5,0,12);for(const a of[0,Math.PI/2,Math.PI,Math.PI*1.5]){const leg=box(lander,.25,3.6,.5,M.dark,Math.cos(a)*2.2,0,Math.sin(a)*2.2);leg.rotation.y=-a;leg.rotation.z=Math.cos(a)*.5;leg.rotation.x=-Math.sin(a)*.5}const lf=new THREE.Mesh(new THREE.ConeGeometry(1.2,4,10),new THREE.MeshBasicMaterial({color:0xffc38a,transparent:true,opacity:.9}));lf.rotation.x=Math.PI;lf.position.y=-.6;lf.visible=false;lander.add(lf);lander.userData.flame=lf;lander.position.set(36,90,34);addStation({id:'lander',name:'Supply lander SL-7','type':'Cargo · 12 t',obj:lander,pos:new THREE.Vector3(36,40,34)});
  // rovers + crew
  const roverG=()=>{const g=new THREE.Group();world.add(g);box(g,3.4,1,2,M.white,0,.6,0);box(g,1.4,.6,1.8,M.acc,-1,1.6,0);const ld=box(g,1.6,.9,1.6,new THREE.MeshStandardMaterial({color:0xbfe6ff}),.6,1.6,0);ld.visible=false;g.userData.load=ld;box(g,.2,1.4,.2,M.mid,-1.4,1.6,.8);for(const [dx,dz] of[[1.2,-1.1],[1.2,1.1],[0,-1.1],[0,1.1],[-1.2,-1.1],[-1.2,1.1]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.4,10),M.tyre);w.rotation.x=Math.PI/2;w.position.set(dx,.5,dz);g.add(w)}return g};
  const addRover=i=>{const r=addAgent({id:'rv'+i,name:`Rover R-${i+1}`,sub:'Ice haul',g:roverG(),pts:[[46,-30],[30,-14],[18,8]],maxSpeed:2.6+i*.2,lane:'reg',loop:false,load:false,stopAt:[0,2],stopTime:5});r.pos.set(46-i*8,-30+i*6);r.i=1;rovers.push(r);return r};for(let i=0;i<2;i++)addRover(i);c.addRover=addRover;
  lane(46,-30,30,-14);lane(30,-14,18,8);lane(0,-22,36,26);
  const astro=(name,role,i)=>{const g=new THREE.Group();world.add(g);box(g,.6,1.1,.5,M.white,0,.35,0);sph(g,.3,new THREE.MeshStandardMaterial({color:0xffd27a,metalness:.4,roughness:.3}),0,1.75,0);box(g,.5,.6,.3,M.acc,0,.8,-.35);const a=addAgent({id:'cr'+i,name,sub:role,g,pts:[[0,8],[-26,18],[18,20],[0,8]],maxSpeed:1,lane:'walk'+i,loop:false,off:.3,stopAt:[1,2],stopTime:6,role,suit:rnd(70,98)});a.pos.set(0+i*2,8);a.i=1;crew.push(a);return a};
  [['Cdr. Rao','Commander'],['Dr. Lindqvist','Botanist'],['Eng. Okafor','Systems'],['Dr. Tanaka','Geologist']].forEach(([n,r],i)=>astro(n,r,i));c.astro=astro;
  for(let i=0;i<3;i++){const g=new THREE.Group();world.add(g);for(let k=0;k<5;k++){const s=sph(g,1+k*.5,new THREE.MeshStandardMaterial({color:0xd9a06c,transparent:true,opacity:.35,roughness:1}),rnd(-.5,.5),1+k*2.2,rnd(-.5,.5));s.castShadow=false}g.position.set(rnd(-60,60),0,rnd(-50,50));devils.push({g,v:rnd(1,2.5),a:rnd(0,6)})}
 },
 apply(c){const u=c.G.up;c.o2Mul=1+.25*u.moxie;c.passive=40*u.green;c.nukeOk=!!u.nuke;c.priceMul=1+.1*u.dish;while(rovers.length<2+u.rover)c.addRover(rovers.length);while(solarArr.length<3+u.solar)c.addArray();while(crew.length<4+2*u.dome)c.astro(['Dr. Alves','Eng. Novak','Dr. Reyes','Cdr. Osei','Dr. Zhang','Eng. Diaz'][crew.length-4],['Medic','Pilot','Chemist','XO','Physicist','Mechanic'][crew.length-4],crew.length)},
 priceMul:c=>c.priceMul||1,rate:c=>(24*(c.o2Mul||1)/60+rovers.length*180/90*.05)*c.price(c.G.active)+(c.passive||0),
 tick(c,dt){const t=c.simT;const storm=c.WX.name==='Dust storm';sol=1412+Math.floor(t/480);
  power=solarArr.length*18*(1-c.nightT)*(storm&&!c.nukeOk?.25:1)+(c.nukeOk?40:0)+(c.nightT>.5?6:0);
  const o2rate=24/60*(c.o2Mul||1)*(power>20?1:.4);o2=clamp(o2+(o2rate-crew.length*.05)*dt*.2,10,100);
  oxy.status=power>20?'running':'power-limited';oxy.obj.children.forEach(m=>{});if(oxy.status==='running'&&Math.random()<dt*4)c.burst(oxy.obj,1,.3,1.2);
  // sell oxygen continuously in 50 kg blocks
  ice+=o2rate*dt;if(ice>=50){ice-=50;c.earn(Math.round(50*c.price(c.G.active)),oxy.obj)}
  // rovers: load at mine, unload at plant
  rovers.forEach(r=>{const atMine=Math.hypot(r.pos.x-46,r.pos.y+30)<1.5,atPlant=Math.hypot(r.pos.x-18,r.pos.y-8)<1.5;if(r.dwell>0&&atMine&&!r.load){r.load=true;r.g.userData.load.visible=true;r.dwellStatus='loading ice';mine.status='drilling'}if(r.dwell>0&&atPlant&&r.load){r.load=false;r.g.userData.load.visible=false;r.dwellStatus='unloading';water+=180;c.earn(Math.round(180*.3*c.price(c.G.active)),r.g)}});
  mine.obj.userData.drill.position.y=5+Math.sin(t*3)*.6;c.stations.find(s=>s.id==='comms').obj.userData.dish.rotation.y=Math.sin(t*.2)*.8;
  greenhouse.dome.material.emissiveIntensity=.35+Math.sin(t*1.2)*.2+c.nightT*.5;
  eva=crew.filter(k=>k.status==='moving'||k.dwell>0&&k.dwellStatus!=='airlock').length;crew.forEach(k=>{k.suit=Math.max(20,k.suit-dt*.01)});
  devils.forEach(d=>{d.a+=dt*.2;d.g.position.x+=Math.cos(d.a)*d.v*dt*(storm?3:1);d.g.position.z+=Math.sin(d.a)*d.v*dt;d.g.rotation.y+=dt*4;d.g.children.forEach((s,i)=>s.material.opacity=(storm?.5:.3)*(1-i*.12));if(Math.abs(d.g.position.x)>70)d.g.position.x*=-.9;if(Math.abs(d.g.position.z)>55)d.g.position.z*=-.9});
  // supply lander mission
  landerT+=dt;if(landerState==='cruise'&&landerT>0){landerState='entry';landerT=0;c.addAlert('ok','Supply lander SL-7 on approach','Entry interface in 40 s',{kind:'station',id:'lander'})}
  else if(landerState==='entry'){const f=clamp(landerT/40,0,1);lander.position.set(lerp(80,36,smooth(f)),lerp(90,30,f),lerp(-20,34,smooth(f)));if(f>.5&&Math.random()<dt*8)c.burst(lander,1,2,.5);if(f>=1){landerState='landing';landerT=0;lander.userData.flame.visible=true}}
  else if(landerState==='landing'){const f=clamp(landerT/18,0,1);lander.position.set(36,lerp(30,.4,smooth(f)),34);c.burst(lander.userData.flame,2,1.5,.4);if(f>.9&&Math.random()<dt*20){const o=new THREE.Object3D();o.position.set(36+rnd(-6,6),.5,34+rnd(-6,6));c.world.add(o);c.burst(o,2,3,1);c.world.remove(o)}if(f>=1){landerState='unloading';landerT=0;lander.userData.flame.visible=false;landings++;padSt.status='lander on pad';const r=rovers[0];r.pts=[[r.pos.x,r.pos.y],[36,26],[0,-22]];r.i=1;r.dir=1;r.sub='Unloading lander';c.addAlert('ok','Touchdown · SL-7','12 t supplies · rover unloading',{kind:'station',id:'pad'})}}
  else if(landerState==='unloading'){if(landerT>40){landerState='stored';landerT=0;const v=Math.round(12000*c.price(c.G.active)*.015);c.earn(v,padSt.obj);c.log('ok','SL-7 cargo stored · 12 t');rovers[0].sub='Ice haul';rovers[0].pts=[[46,-30],[30,-14],[18,8]];rovers[0].i=1;rovers[0].dir=1}}
  else if(landerState==='stored'&&landerT>30){landerState='cruise';landerT=-rnd(90,160);lander.position.set(80,90,-20);padSt.status='clear'}
  c.stations.find(s=>s.id==='lander').pos.copy(lander.position).add(new THREE.Vector3(0,4,0))},
 slow(c){c.kpi(0,`${o2.toFixed(0)}<small>%</small>`,`${(24*(c.o2Mul||1)).toFixed(0)} kg/sol · ${c.fmt(water)} L water`,o2<30?'bad':o2<50?'warn':'');c.spark(0,o2);c.kpi(1,`${power.toFixed(0)}<small>kW</small>`,c.WX.name==='Dust storm'?(c.nukeOk?'reactor carrying the base':'arrays dimmed by dust'):c.nightT>.5?'batteries · night':'arrays at full sun',power<20?'bad':power<35?'warn':'');c.spark(1,power);c.kpi(2,`${eva}<small>/ ${crew.length}</small>`,`${landerState==='cruise'?'next lander in '+Math.max(0,Math.round(-landerT))+' s':'lander: '+landerState}`,'');c.spark(2,eva)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;if(a.role)return{type:a.role,status:a.status==='moving'?'on EVA':a.dwellStatus||'airlock',stats:[['Suit O₂',a.suit.toFixed(0)+' %'],['EVA time',Math.floor(a.trips*22)+' min'],['Role',a.role]],bar:a.suit};return{type:a.sub,status:a.status,stats:[['Load',a.load?'180 kg ice':'empty'],['Speed',(a.speed*3.6).toFixed(1)+' km/h'],['Trips',Math.floor(a.trips)],['Battery','74 %']]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.id==='lander')return{type:s.type,status:landerState,stats:[['Altitude',Math.max(0,lander.position.y-.4).toFixed(0)*10+' m'],['Landings',landings],['Cargo','12,000 kg']]};
  if(s.kw!==undefined)return{type:s.type,status:s.status,level:s.status==='power-limited'?'warn':'',stats:[['Pressure',(s.kpa||0)+' kPa'],['Temp',s.temp+' °C'],['Power',s.kw+' kW'],['O₂ reserve',o2.toFixed(0)+' %']]};
  return{type:s.type,status:'nominal',stats:[['Sol',sol],['Power',power.toFixed(0)+' kW']]}}
});
</script></body></html>
