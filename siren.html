<script type="module">
import {createWorld,THREE,rnd,lerp,clamp,smooth} from './kit.js';
const LINES=[-36,-12,12,36];const units=[],incidents=[],buildings=[],stations={};let incSeq=2200,closed=0,respSum=0,respN=0,bays=[],flood=0;
const PH=['Reported','Dispatched','En route','On scene','Contained','Closed'];
const nearLine=v=>LINES.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
function route(a,b){const zi=nearLine((a[1]+b[1])/2);return[[a[0],a[1]],[a[0],zi],[b[0],zi],[b[0],b[1]]]}
createWorld({
 id:'siren',num:16,name:'Siren',tag:'Emergency response city',site:'Metro district 4 · 3 stations',accent:'#EF4444',accentRgb:'239,68,68',accentInk:'#b91c1c',
 wordmark:'Si<b>ren</b>',intro:'A downtown grid, a fire station, a police station, a hospital, a river and a highway. <b>Every incident closed pays the municipal contract.</b> Add units, cut response times, bank Charter.',
 ldSteps:['checking the hydrants','rostering crews','testing the sirens','first call'],plantName:'Dispatch centre',productLabel:'Service contracts',
 sky:0xeef1f5,groundStops:['#eef1f5','#d9dee6','#bcc4cf'],pal:{wall:0xf3f4f6,asphalt:0xb4bac4,floor:0xdde2e8,water:0x6fa9c7},temps:[30,26,16,41],wx:{rain:'Monsoon flooding',fog:'Fog',heat:'Heatwave'},particle:0xffb27a,lamps:[[-24,-24],[24,24],[0,0]],
 overview:{t:[0,0,0],z:54},introFrom:[-24,2,-24],
 areas:{dt:{num:'ST-01',label:'Downtown',t:[-24,4,-24],z:22},river:{num:'ST-02',label:'Riverside',t:[0,1,30],z:22},hwy:{num:'ST-03',label:'Highway',t:[46,1,0],z:22},res:{num:'ST-04',label:'Residential',t:[24,1,-24],z:20}},
 kpis:[{label:'Active incidents'},{label:'Average response'},{label:'Units available'}],
 products:{muni:{name:'Municipal contract',sub:'city budget · per call',price:2400,unlock:0,unit:'per incident',svg:'<path d="M22 4l16 28H6z" fill="currentColor" opacity=".9"/>'},mutual:{name:'Regional mutual aid',sub:'district pool · +80%',price:4300,unlock:90000,unit:'per incident',svg:'<rect x="6" y="8" width="32" height="14" rx="2" fill="currentColor" opacity=".9"/>'},state:{name:'State emergency',sub:'disaster retainer · 4×',price:9600,unlock:450000,unit:'per incident',svg:'<circle cx="22" cy="15" r="9" fill="currentColor" opacity=".9"/>'}},
 upgrades:[{id:'engine',name:'Extra fire engine',fx:'+1 engine per tier',cost:7000},{id:'amb',name:'Extra ambulance',fx:'+1 ambulance per tier',cost:6000},{id:'ai',name:'Dispatch AI',fx:'Dispatch 30% faster per tier',cost:8000},{id:'hydrant',name:'Hydrant network',fx:'Fires contained 25% faster',cost:9000},{id:'drone',name:'Drone recon',fx:'+50 ⚡/s passive per tier',cost:6500},{id:'preempt',name:'Traffic pre-emption',fx:'Units 15% faster per tier',cost:7500},{id:'flood',name:'Flood barriers',fx:'Monsoon no longer closes low roads',cost:10000}],
 tabs:[{id:'inc',label:'Incidents',cols:['ID','Type','Location','Phase','Status'],rows:c=>incidents.slice(-8).reverse().map(i=>({pick:{kind:'station',id:i.b.id},cells:['#'+i.id,i.type,i.b.name,PH[i.ph],i.ph===5?'ok':i.ph>=3?'on scene':'open']})),meta:c=>closed+' closed today'},
       {id:'units',label:'Units',cols:['Unit','Station','Task','Speed','Status'],rows:c=>units.map(u=>({pick:{kind:'agent',agent:u},cells:[u.name,u.home,u.inc?'#'+u.inc.id:u.utype==='police'?'patrol':'standby',(u.speed*3.6).toFixed(0)+' km/h',u.inc?'responding':u.utype==='police'?'moving':'idle']}))},
       {id:'st',label:'Stations',cols:['Station','Units','Available','Calls','Status'],rows:c=>Object.values(stations).map(s=>({pick:{kind:'station',id:s.id},cells:[s.name,units.filter(u=>u.home===s.name).length,units.filter(u=>u.home===s.name&&!u.inc).length,s.calls,'open']}))}],
 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  for(const v of LINES){box(world,140,.2,6,M.asphalt,0,-.1,v);box(world,6,.2,140,M.asphalt,v,-.1,0)}
  box(world,10,.25,140,M.asphalt,52,-.08,0);for(let z=-66;z<66;z+=6)box(world,.3,.05,3,M.white,52,.12,z,{shadow:false});stencil('ST-03 HIGHWAY',52,-60,12,0,'#9aa3b2');
  const river=new THREE.Mesh(new THREE.PlaneGeometry(160,14),M.water);river.rotation.x=-Math.PI/2;river.position.set(0,.03,48);river.receiveShadow=true;world.add(river);for(const x of[-12,12])box(world,8,.8,16,M.white,x,.1,48);stencil('ST-02 RIVERSIDE',0,36,14,0,'#9aa3b2');
  const bld=(x,z,w,h,d,mat,name,type,id,kind)=>{const g=new THREE.Group();g.position.set(x,0,z);world.add(g);box(g,w,h,d,mat,0,0,0);for(let y=1.6;y<h-1;y+=2.6)for(let k=-w/2+1.4;k<w/2-1;k+=2.2){const win=box(g,1,1,.15,M.window,k,y,d/2+.05,{shadow:false});win.userData.win=1}box(g,w+.4,.3,d+.4,M.grey,0,h,0);contact(w+4,d+4,x,z,.16);const b=addStation({id,name,type,obj:g,pos:new THREE.Vector3(x,h/2,z),door:[nearLine(x),z],x,z,zone:kind,fire:0,smoke:[]});buildings.push(b);return b};
  let bi=0;const cells=[];for(let i=-2;i<2;i++)for(let j=-2;j<2;j++)cells.push([i*24+12+(i<0?-6:6)*0,j*24+12]);
  cells.forEach(([cx,cz],ci)=>{const down=cx<0&&cz<0,res=cx>0&&cz<0;if(cz>24)return;for(let k=0;k<(down?3:2);k++){const ox=rnd(-7,7),oz=rnd(-7,7);const h=down?rnd(10,22):res?rnd(3,5):rnd(5,9);bld(cx+ox,cz+oz,down?rnd(6,9):res?5:rnd(6,8),h,down?rnd(6,9):res?5:rnd(6,8),res?M.white:M.wall,`${['Anna','Mount','Harbour','Nehru','Oak','Temple','Park','Lake'][bi%8]} ${down?'Tower':res?'Lane':'Block'} ${bi+1}`,down?'Office tower':res?'Residence':'Mixed use',`b${bi}`,down?'downtown':res?'residential':'mixed');bi++}});
  stencil('ST-01 DOWNTOWN',-24,-44,12,0,'#9aa3b2');stencil('ST-04 RESIDENTIAL',24,-44,14,0,'#9aa3b2');
  const station=(id,name,type,x,z,col,n)=>{const g=new THREE.Group();g.position.set(x,0,z);world.add(g);box(g,14,6,10,M.wall,0,0,0);box(g,14.6,.4,10.6,M.grey,0,6,0);box(g,14,.6,.5,col,0,5.2,5.2);const doors=[];for(let k=0;k<n;k++){const d=box(g,3.2,4,.3,M.dark,-4.5+k*4.5,0,5.1);doors.push(d)}const s=addStation({id,name,type,obj:g,pos:new THREE.Vector3(x,3,z),door:[nearLine(x),z+8],doors,calls:0});stations[id]=s;return s};
  station('fire','Fire station 4','3 engines · 1 ladder',-24,-4,new THREE.MeshStandardMaterial({color:0xef4444}),3);station('police','Police station','Patrol · 4 cars',24,-4,new THREE.MeshStandardMaterial({color:0x1e5eff}),2);station('hosp','District hospital','ER · 2 ambulances',0,22,new THREE.MeshStandardMaterial({color:0x0ea5e9}),2);box(world,2.6,.6,.3,M.white,0,4.6,27.3);box(world,.6,2.6,.3,M.white,0,3.6,27.3);
  for(const [x,z] of[[-60,-60],[60,-60],[-60,30],[60,30],[-48,10],[48,-48]])tree(x,z,1.1);
  const veh=(name,col,w,h,lamp)=>{const g=new THREE.Group();world.add(g);box(g,w,h,1.8,col,0,.4,0);box(g,1.6,.9,1.6,M.glass,w/2-1.2,h+.3,0,{shadow:false});const l=box(g,1,.3,1.4,new THREE.MeshStandardMaterial({color:lamp,emissive:lamp,emissiveIntensity:0}),0,h+.4,0,{shadow:false});g.userData.lamp=l;for(const [dx,dz] of[[w/3,-.9],[w/3,.9],[-w/3,-.9],[-w/3,.9]]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,10),M.tyre);t.rotation.x=Math.PI/2;t.position.set(dx,.4,dz);g.add(t)}return g};
  const addUnit=(kind,i)=>{const home=kind==='engine'?stations.fire:kind==='ambulance'?stations.hosp:stations.police;const col=kind==='engine'?new THREE.MeshStandardMaterial({color:0xef4444}):kind==='ambulance'?M.white:new THREE.MeshStandardMaterial({color:0x1e5eff});const g=veh(kind,col,kind==='engine'?6:kind==='ambulance'?4.4:3.6,kind==='engine'?2.2:kind==='ambulance'?2:1,kind==='police'?0x1e5eff:0xef4444);if(kind==='engine')box(g,5,.3,.4,M.yellow,-.5,2.6,0);
    const u=addAgent({id:kind+i,name:kind==='engine'?`Engine 4-${i+1}`:kind==='ambulance'?`Medic ${i+1}`:`Patrol ${i+1}`,sub:kind,g,pts:kind==='police'?[[-36,-36],[36,-36],[36,36],[-36,36]]:[home.door,home.door],maxSpeed:kind==='police'?5:6,lane:'road',loop:kind==='police',utype:kind,home:home.name,homeDoor:home.door,inc:null});u.pos.set(...(kind==='police'?[-36+i*20,-36]:home.door));u.i=1;if(kind!=='police')u.paused=true;units.push(u);return u};
  for(let i=0;i<2;i++)addUnit('engine',i);for(let i=0;i<1;i++)addUnit('ambulance',i);for(let i=0;i<2;i++)addUnit('police',i);c.addUnit=addUnit;
  const car=col=>{const g=new THREE.Group();world.add(g);box(g,3.2,.9,1.5,col,0,.3,0);box(g,1.6,.7,1.3,M.glass,-.1,1.2,0,{shadow:false});return g};
  [[-36,-70,-36,70],[12,70,12,-70],[-70,12,70,12],[52,-70,52,70],[52,70,52,-70]].forEach(([x0,z0,x1,z1],i)=>{for(let k=0;k<2;k++){const a=addAgent({id:`c${i}${k}`,name:'Car '+(i*2+k+1),sub:'Traffic',g:car([M.white,M.dark,M.mid,M.yellow][(i+k)%4]),pts:[[x0,z0],[x1,z1]],maxSpeed:4+k,lane:'road',loop:false,civ:true});a.pos.set(lerp(x0,x1,k/2),lerp(z0,z1,k/2));a.i=1}});
  c.fireFx=(b,on)=>{if(on&&!b.fx){b.fx=new THREE.Object3D();b.fx.position.set(b.x,b.pos.y*2+1,b.z);world.add(b.fx)}};
 },
 apply(c){const u=c.G.up;c.dispMul=1-.3*u.ai;c.containMul=1-.25*Math.min(1,u.hydrant)*(.5+u.hydrant/6);c.passive=50*u.drone;c.speedMul=1+.15*u.preempt;c.floodOk=!!u.flood;while(units.filter(x=>x.utype==='engine').length<2+u.engine)c.addUnit('engine',units.filter(x=>x.utype==='engine').length);while(units.filter(x=>x.utype==='ambulance').length<1+u.amb)c.addUnit('ambulance',units.filter(x=>x.utype==='ambulance').length);units.forEach(x=>x.maxSpeed=(x.utype==='police'?5:6)*c.speedMul)},
 priceMul:c=>1,rate:c=>units.filter(u=>u.utype!=='police').length/45*c.price(c.G.active)+(c.passive||0),
 tick(c,dt){const t=c.simT;const monsoon=c.WX.name==='Monsoon flooding';flood=lerp(flood,monsoon&&!c.floodOk?1:0,dt*.3);
  // new incidents
  if(incidents.filter(i=>i.ph<5).length<2+units.length/2&&Math.random()<dt*.12){const b=buildings[Math.floor(Math.random()*buildings.length)];const r=Math.random();const type=r<.45?'Structure fire':r<.75?'Medical call':'Traffic collision';const inc={id:incSeq++,type,b,ph:0,t:0,t0:t,unit:null,need:type==='Structure fire'?'engine':type==='Medical call'?'ambulance':'police'};if(type==='Traffic collision'){inc.door=[52,rnd(-50,50)]}else inc.door=b.door;incidents.push(inc);if(incidents.length>40)incidents.shift();if(type==='Structure fire')b.fire=1;c.addAlert('bad',`#${inc.id} ${type}`,type==='Traffic collision'?'Highway · northbound':b.name,{kind:'station',id:b.id})}
  for(const inc of incidents){if(inc.ph>=5)continue;inc.t+=dt;
    if(inc.ph===0){const free=units.filter(u=>u.utype===inc.need&&!u.inc)[0]||units.filter(u=>u.utype!=='police'&&!u.inc)[0];if(free&&inc.t>2*(c.dispMul||1)){inc.unit=free;free.inc=inc;free.paused=false;free.loop=false;free.pts=route([free.pos.x,free.pos.y],inc.door);free.i=1;free.dir=1;inc.ph=1;inc.t=0;const home=Object.values(stations).find(s=>s.name===free.home);if(home){home.calls++;home.doors.forEach(d=>d.userData.open=t)}}}
    else if(inc.ph===1&&inc.t>1){inc.ph=2}
    else if(inc.ph===2){const u=inc.unit;if(Math.hypot(u.pos.x-inc.door[0],u.pos.y-inc.door[1])<1.2){inc.ph=3;inc.t=0;respSum+=t-inc.t0;respN++;u.dwell=99;u.dwellStatus='on scene'}}
    else if(inc.ph===3&&inc.t>(inc.type==='Structure fire'?14*(c.containMul||1):8)){inc.ph=4;inc.t=0;if(inc.type==='Structure fire')inc.b.fire=0}
    else if(inc.ph===4&&inc.t>4){inc.ph=5;closed++;const v=Math.round(c.price(c.G.active)*(inc.type==='Structure fire'?1.5:1));c.earn(v,inc.unit.g);c.log('ok',`#${inc.id} closed · ${inc.type}`);const u=inc.unit;u.inc=null;u.dwell=0;if(u.utype==='police'){u.loop=true;u.pts=[[-36,-36],[36,-36],[36,36],[-36,36]];u.i=0}else{u.pts=route([u.pos.x,u.pos.y],u.homeDoor);u.i=1;u.dir=1;u.onEnd=()=>{u.paused=true;u.onEnd=null}}}}
  // fire smoke, unit lights, traffic pulls aside, bay doors
  buildings.forEach(b=>{if(b.fire>0&&Math.random()<dt*14){const o=new THREE.Object3D();o.position.set(b.x+rnd(-2,2),b.pos.y*2+.5,b.z+rnd(-2,2));c.world.add(o);c.burst(o,1,.6,3);c.world.remove(o)}});
  units.forEach(u=>{const on=!!u.inc&&u.inc.ph<4;u.g.userData.lamp.material.emissiveIntensity=on?(Math.sin(t*14)>0?2.5:.2):0;if(on&&u.status==='moving'){for(const a of c.agents){if(!a.civ)continue;const d=Math.hypot(a.pos.x-u.pos.x,a.pos.y-u.pos.y);if(d<7&&a.dwell<=0){a.dwell=1.5;a.dwellStatus='pulling aside'}}}});
  Object.values(stations).forEach(s=>s.doors.forEach(d=>{const open=d.userData.open&&t-d.userData.open<8;d.position.y=lerp(d.position.y,open?4.6:2,dt*3)}));
  c.agents.forEach(a=>{if(a.civ&&flood>.5&&a.pos.y>20&&a.dwell<=0){a.dwell=2;a.dwellStatus='flooded road'}});
  c.M.water.color.setHex(0x6fa9c7).lerp(new THREE.Color(0x8b7355),flood*.6);},
 slow(c){const act=incidents.filter(i=>i.ph<5).length;c.kpi(0,`${act}`,`${closed} closed today · ${incidents.filter(i=>i.ph<5&&i.type==='Structure fire').length} fires`,act>4?'bad':act>2?'warn':'');c.spark(0,act);const avg=respN?respSum/respN:0;c.kpi(1,`${avg.toFixed(0)}<small>s</small>`,'target 300 s',avg>300?'bad':avg>200?'warn':'');c.spark(1,avg);const av=units.filter(u=>!u.inc).length;c.kpi(2,`${av}<small>/ ${units.length}</small>`,`${units.filter(u=>u.utype==='engine').length} engines · ${units.filter(u=>u.utype==='ambulance').length} medics · ${units.filter(u=>u.utype==='police').length} patrols`,av===0?'bad':'');c.spark(2,av)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;if(a.utype)return{type:`${a.utype} · ${a.home}`,status:a.inc?PH[a.inc.ph].toLowerCase():a.utype==='police'?'patrolling':'standby',level:a.inc?'warn':'',stats:[['Incident',a.inc?'#'+a.inc.id+' '+a.inc.type:'—'],['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Crew',a.utype==='engine'?'4':'2'],['Calls today',Math.floor(a.trips)]]};return{type:a.sub,status:a.status,stats:[['Speed',(a.speed*3.6).toFixed(0)+' km/h']]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.fire!==undefined){const inc=incidents.filter(i=>i.b===s&&i.ph<5).at(-1);return{type:s.type,status:inc?inc.type+' · '+PH[inc.ph]:'quiet',level:s.fire?'bad':inc?'warn':'',stats:[['District',s.zone],['Incidents today',incidents.filter(i=>i.b===s).length],['Occupancy',s.zone==='downtown'?'high':'low']]}}
  if(s.doors)return{type:s.type,status:'open',stats:[['Units',units.filter(u=>u.home===s.name).length],['Available',units.filter(u=>u.home===s.name&&!u.inc).length],['Calls today',s.calls]]};
  return{type:s.type,status:'open',stats:[['Closed today',closed]]}}
});
