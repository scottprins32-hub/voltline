 },

   case 'landing':{const f=clamp(T/22,0,1);const from=booster.userData.from;const px=lerp(from.x,LZ.x,smooth(f)),pz=lerp(from.z,LZ.z,smooth(f)),py=lerp(from.y,.6,f<.5?f*.6:.3+smooth((f-.5)/.5)*.7);rocket.position.set(px,py,pz);rocket.rotation.z=f<.2?lerp(0,Math.PI,f/.2):f<.4?Math.PI:lerp(Math.PI,Math.PI*2,(f-.4)/.6);flame.visible=f>.3&&f<.98;if(flame.visible)c.burst(flame,2,1.5,.5);booster.children.forEach(m=>{if(m.userData.leg)m.rotation.x=lerp(m.rotation.x,f>.85?.5:0,dt*3)});
     if(f>=1){const landed=Math.random()<(.85+.05*c.G.up.reuse);const m=missions.at(-1);m.landed=landed;m.done=true;if(landed)boosterLandings++;payloadToday+=m.kg;const v=Math.round(c.price(c.G.active)*(landed?1+(c.reuseBonus||0):1));c.earn(v,landZone.obj);c.addAlert(landed?'ok':'warn',landed?'Booster landed on LZ-1':'Booster lost offshore',`${m.name} · ${m.kg} kg to ${m.orbit}`,{kind:'station',id:'lz'});state='reset';T=0}break}
   case 'reset':{if(T>12*(c.turnMul||1)){state='rollout';T=0;stage2.visible=true;stage2.position.set(0,22,0);rocket.rotation.set(0,0,0);rocket.position.set(VAB.x,2.8,VAB.z+16);booster.children.forEach(m=>{if(m.userData.leg)m.rotation.x=0});crawler.paused=true;crawler.pos.set(VAB.x,VAB.z+16)}break}}
  tminus=state==='count'?tminus:state==='fueling'?600-T*10:state==='rollout'?900:0;
  ring.material.emissiveIntensity=state==='landing'?2+Math.sin(t*10):lerp(.9,2.2,c.nightT);c.dishes.forEach(o=>o.rotation.y=Math.sin(t*.3)*.6);
  c.stations.find(s=>s.id==='rocket').pos.copy(rocket.position).add(new THREE.Vector3(0,12,0));c.stations.find(s=>s.id==='booster').pos.copy(rocket.position).add(new THREE.Vector3(0,10,0))},
 slow(c){const tm=state==='count'||state==='fueling'?`T−${Math.floor(tminus/60)}:${String(Math.floor(tminus%60)).padStart(2,'0')}`:state==='liftoff'||state==='sep'||state==='landing'?`T+${Math.floor(T)}s`:'—';c.kpi(0,tm,`${PH[Math.max(0,['rollout','fueling','count','liftoff','sep','landing','reset'].indexOf(state))]||'turnaround'} · ${missions.at(-1)?.name||'next mission'}`,state==='count'&&c.WX.name==='Monsoon'&&!c.radarOk?'bad':'');c.spark(0,tminus);c.kpi(1,`${c.fmt(payloadToday)}<small>kg</small>`,`${launches} launches · ${boosterLandings} boosters landed`,'');c.spark(1,payloadToday);c.kpi(2,`${state==='reset'||state==='rollout'?100:50}<small>%</small>`,'Pad 2 '+(c.G.up.pad2?'active':'in refurbishment'),'');c.spark(2,state==='reset'?100:50)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,stats:[['Task',a.sub],['Speed',(a.speed*3.6).toFixed(1)+' km/h'],['Trips',Math.floor(a.trips)]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.id==='rocket'||s.id==='booster'){const alt=Math.max(0,rocket.position.y-1.2)*120;return{type:s.type,status:state,level:state==='landing'?'warn':'',stats:[['Altitude',c.fmt(alt)+' m'],['Velocity',(state==='liftoff'?T*T*38:state==='landing'?240:0).toFixed(0)+' m/s'],['Downrange',Math.max(0,rocket.position.x-PAD.x).toFixed(1)+' km'],['Propellant',Math.max(0,100-(state==='liftoff'?T*8:state==='sep'||state==='landing'?92:0)).toFixed(0)+' %'],['Mission',missions.at(-1)?.name||'—']],bar:state==='count'?100-tminus/90*100:null}}
  if(s.id.startsWith('pad'))return{type:s.type,status:s.active?state:'idle',stats:[['Vehicle',s.active?'Volt-9 B1071':'—'],['Phase',s.active?PH[Math.max(0,['rollout','fueling','count','liftoff','sep','landing'].indexOf(state))]:'—'],['Swing arm',s.active&&state==='count'&&tminus<20?'retracted':'mated']]};
  if(s.id==='lz')return{type:s.type,status:state==='landing'?'booster inbound':'clear',stats:[['Landings',boosterLandings],['Reuse bonus','+'+Math.round((c.reuseBonus||0)*100)+' %']]};
  return{type:s.type,status:'open',stats:[['Launches today',launches],['Payload',c.fmt(payloadToday)+' kg']]}}
});
