<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Berthwise — container port</title>
<meta name="description" content="Berthwise: a live 3D container terminal you can run. World 03 of Voltline Worlds."><meta name="theme-color" content="#f3f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="kit.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230FA3A3'/%3E%3Cpath d='M14 46h36M20 46V22h24v24M14 22h36' stroke='%23fff' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<script src="meta.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import {createWorld,THREE,rnd,lerp,clamp,smooth} from './kit.js';
const cranes=[],ships=[],trucks=[],stacks=[];let moves=0,movesH=0,yardBoxes=0,gate,rail,rtgs=[],sea,boxMats;
const QUAY=12,SHIP_Z=20;
createWorld({
 id:'berthwise',num:3,name:'Berthwise',tag:'Container port',site:'Kattupalli terminal · Bay of Bengal',accent:'#0FA3A3',accentRgb:'15,163,163',accentInk:'#0b6b6b',
 wordmark:'Berth<b>wise</b>',intro:'Two ships on the quay, four gantry cranes, a yard full of boxes and a rail siding. <b>Every lifted container earns.</b> Tier up the terminal and bank Charter.',
 ldSteps:['mooring the ships','lifting the booms','queueing the trucks','opening the gate'],plantName:'Terminal office',productLabel:'Cargo contracts',
 sky:0xf1f6f6,groundStops:['#f6f3ec','#e7e2d6','#cfc8b8'],pal:{wall:0xf6f2ea,asphalt:0xc9ccd0,water:0x5fb3c9},temps:[33,27,18,42],wx:{rain:'Cyclone rain',fog:'Sea fog',heat:'Heatwave'},lamps:[[-30,4],[10,4],[0,-16]],
 overview:{t:[0,0,-4],z:50},introFrom:[-20,2,12],
 areas:{berths:{num:'ST-01',label:'Berths',t:[-5,2,14],z:24},yard:{num:'ST-02',label:'Yard',t:[0,1,-16],z:22},gate:{num:'ST-03',label:'Gate',t:[52,1,-30],z:16},rail:{num:'ST-04',label:'Rail',t:[-20,1,-38],z:20}},
 kpis:[{label:'Moves per hour'},{label:'Berth occupancy'},{label:'Yard utilisation'}],
 products:{dry:{name:'Dry boxes',sub:'standard 40 ft',price:1200,unlock:0,unit:'per move',svg:'<rect x="6" y="8" width="32" height="14" rx="2" fill="currentColor" opacity=".9"/>'},reefer:{name:'Reefers',sub:'refrigerated · +65%',price:2000,unlock:60000,unit:'per move',svg:'<rect x="6" y="8" width="32" height="14" rx="2" fill="currentColor" opacity=".9"/><circle cx="33" cy="15" r="3" fill="#fff"/>'},project:{name:'Project cargo',sub:'out-of-gauge · 3×',price:3600,unlock:300000,unit:'per move',svg:'<path d="M4 22h36l-6-12H10z" fill="currentColor" opacity=".9"/>'}},
 upgrades:[{id:'crane',name:'Crane hoist speed',fx:'Cycle 15% faster per tier',cost:5000},{id:'truck',name:'Extra terminal truck',fx:'+1 truck per tier',cost:7000},{id:'rtg',name:'Automated RTG',fx:'Stacking 25% faster',cost:8000},{id:'dredge',name:'Berth dredging',fx:'Ships turn around faster',cost:9000},{id:'gate',name:'Gate lanes',fx:'+10% price per move',cost:11000},{id:'railx',name:'Rail shuttle',fx:'+40 ⚡/s passive per tier',cost:6000},{id:'cold',name:'Cold store',fx:'Reefer moves +20% price',cost:12000}],
 tabs:[{id:'cranes',label:'Cranes',cols:['Crane','Phase','Cycle','Moves','Status'],rows:c=>cranes.map(k=>({pick:{kind:'station',id:k.id},cells:[k.name,k.phase,k.cycle.toFixed(0)+' s',k.moves,k.status]})),meta:c=>moves+' moves today'},
       {id:'fleet',label:'Trucks',cols:['Truck','Load','Speed','Trips','Status'],rows:c=>trucks.map(t=>({pick:{kind:'agent',agent:t},cells:[t.name,t.loaded?'1 × 40 ft':'empty',(t.speed*3.6).toFixed(0)+' km/h',Math.floor(t.trips),t.status]}))},
       {id:'ships',label:'Vessels',cols:['Vessel','Berth','Boxes left','ETD','Status'],rows:c=>ships.map(s=>({pick:{kind:'station',id:s.id},cells:[s.name,s.berth,s.left,s.left>0?Math.round(s.left*1.5)+' min':'—',s.status]}))}],
 build(c){const {box,cyl,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  sea=new THREE.Mesh(new THREE.PlaneGeometry(400,160,80,32),M.water);sea.rotation.x=-Math.PI/2;sea.position.set(0,-.4,QUAY+80);sea.receiveShadow=true;world.add(sea);c.seaGeo=sea.geometry;
  box(world,150,1.2,34,M.asphalt,0,-.9,QUAY-17);box(world,150,.4,1.2,M.yellow,0,.3,QUAY-.6);for(let x=-70;x<75;x+=10)box(world,.8,1.4,.8,M.dark,x,.3,QUAY-1.4);
  boxMats=[0x0FA3A3,0xe8452c,0x1e5eff,0xf59e0b,0xffffff,0x7c5cff].map(h=>new THREE.MeshStandardMaterial({color:h,roughness:.8}));
  const addShip=(i,x,name)=>{const g=new THREE.Group();g.position.set(x,0,SHIP_Z);world.add(g);box(g,36,3,9,new THREE.MeshStandardMaterial({color:0x1f2937,roughness:.7}),0,-.5,0);box(g,36,1.4,9.4,M.white,0,2.4,0);box(g,5,6,8,M.white,-14,3.8,0);box(g,5.4,.4,8.4,M.acc,-14,9.8,0);cyl(g,.6,.8,3,M.dark,-13,10.2,0);
    const cargo=[];for(let bx=0;bx<6;bx++)for(let bz=0;bz<3;bz++)for(let by=0;by<2+(bx%3);by++){const b=box(g,4,2,2.3,boxMats[(bx+bz+by)%6],-7+bx*4.3,3.8+by*2.1,-2.4+bz*2.4);cargo.push(b)}
    const s=addStation({id:'ship'+i,name,type:'8,500 TEU feeder',obj:g,pos:new THREE.Vector3(x,6,SHIP_Z),g,cargo,left:cargo.length,berth:'B'+(i+1),status:'alongside',home:x,t:0});ships.push(s)};
  addShip(0,-30,'MV Coromandel');addShip(1,22,'MV Marina Star');
  const addCrane=(i,x)=>{const g=new THREE.Group();g.position.set(x,0,QUAY-6);world.add(g);for(const [dx,dz] of[[-3,0],[3,0],[-3,-8],[3,-8]])box(g,.9,16,.9,M.acc,dx,0,dz);box(g,7.6,1,1,M.acc,0,16,0);box(g,7.6,1,1,M.acc,0,16,-8);const boom=box(g,1.2,.8,34,M.acc,0,17,6);box(g,1.2,.8,10,M.mid,0,17,-10);box(g,3,2.4,3,M.white,0,12,-4);
    const trolley=new THREE.Group();trolley.position.set(0,16.4,0);g.add(trolley);box(trolley,2.2,1,2.2,M.dark,0,0,0);const cable=box(trolley,.12,10,.12,M.dark,0,-10,0,{shadow:false});const spreader=new THREE.Group();spreader.position.y=-10;trolley.add(spreader);box(spreader,4.2,.5,2.4,M.yellow,0,0,0);const held=box(spreader,4,2,2.3,boxMats[i%6],0,-2,0);held.visible=false;
    contact(10,12,x,QUAY-10,.18);cranes.push(addStation({id:'sts'+i,name:`STS-${i+1}`,type:'Ship-to-shore gantry',obj:g,pos:new THREE.Vector3(x,10,QUAY-6),g,trolley,cable,spreader,held,phase:'idle',t:rnd(0,20),cycle:38,moves:0,ship:ships[i<2?0:1],x}))};
  [-40,-20,12,32].forEach(addCrane);stencil('ST-01 BERTHS',-4,QUAY-14,14);
  // yard blocks + RTGs
  for(let bx=0;bx<5;bx++)for(let bz=0;bz<2;bz++){const g=new THREE.Group();const x=-48+bx*22,z=-12-bz*14;g.position.set(x,0,z);world.add(g);const st={g,x,z,n:0,max:40,boxes:[]};for(let i=0;i<10+bx*2;i++)stackBox(st);stacks.push(st);lane(x-11,z+6.5,x+11,z+6.5)}
  function stackBox(st){if(st.n>=st.max)return;const i=st.n;const col=i%8,row=Math.floor(i/8)%2,lvl=Math.floor(i/16);const b=box(st.g,2.3,2,4,boxMats[(i*7)%6],-8.5+col*2.45,lvl*2.1,-2.5+row*4.5);st.boxes.push(b);st.n++;yardBoxes++}
  c.stackBox=stackBox;
  for(let i=0;i<2;i++){const g=new THREE.Group();g.position.set(-48,0,-12-i*14);world.add(g);for(const dz of[-5.5,5.5]){box(g,.8,9,.8,M.white,0,0,dz);box(g,.8,9,.8,M.white,0,0,dz)}box(g,1,.8,12,M.white,0,9,0);box(g,2,.8,1.6,M.dark,0,9.2,0);for(const dz of[-5.5,5.5])cyl(g,.5,.5,.6,M.tyre,0,0,dz,10).rotation.z=Math.PI/2;
    rtgs.push(addStation({id:'rtg'+i,name:`RTG-${i+1}`,type:'Rubber-tyred gantry',obj:g,pos:new THREE.Vector3(-48,6,-12-i*14),g,row:i,target:0}))}
  stencil('ST-02 CONTAINER YARD',0,-34,20);
  // gate + warehouses + rail + lighthouse
  {const g=new THREE.Group();world.add(g);for(let i=0;i<4;i++){box(g,2,2.6,2,M.white,46+i*4,0,-30);box(g,.2,.3,3,M.yellow,48+i*4,1.6,-30)}box(g,16,.4,2,M.acc,52,3.2,-30);gate=addStation({id:'gate',name:'Gate complex',type:'4 lanes · OCR',obj:g,pos:new THREE.Vector3(52,2,-30)});stencil('ST-03 GATE',52,-24,10)}
  for(let i=0;i<2;i++){box(world,18,6,10,M.wall,-62,0,-14-i*14);box(world,18.4,.4,10.4,M.grey,-62,6,-14-i*14)}
  {for(const dz of[-.9,.9])box(world,120,.18,.2,M.rail,-10,0,-38+dz);for(let x=-70;x<50;x+=1.6)box(world,.5,.14,2.4,M.mid,x,0,-38,{shadow:false});const g=new THREE.Group();g.position.set(-30,0,-38);world.add(g);box(g,7,2.6,2.6,M.acc,0,.6,0);for(let i=0;i<4;i++){box(g,7.2,.3,2.6,M.dark,-9-i*8,.6,0);box(g,6.6,2.4,2.4,boxMats[i%6],-9-i*8,.9,0)}rail=addStation({id:'rail',name:'Rail siding',type:'Container train · 5 wagons',obj:g,pos:new THREE.Vector3(-30,3,-38),g});stencil('ST-04 RAIL SIDING',-20,-44,16)}
  {const g=new THREE.Group();g.position.set(64,0,QUAY+6);world.add(g);cyl(g,1.2,1.6,9,M.white,0,0,0,12);cyl(g,1.3,1.3,1,M.acc,0,4,0,12);box(g,2,1.4,2,M.acc,0,9,0);addStation({id:'light',name:'Lighthouse',type:'Harbour mark',obj:g,pos:new THREE.Vector3(64,6,QUAY+6)})}
  for(const [x,z] of[[-72,-30],[70,-10],[70,-40],[-72,2]])tree(x,z,1.1);
  // truck loop: quay lane ↔ yard
  const truckG=()=>{const g=new THREE.Group();world.add(g);box(g,1.6,1.6,2,M.acc,-2.2,.4,0);box(g,5,.4,2.2,M.dark,.4,.4,0);const ld=box(g,4,2,2.2,boxMats[2],.8,.8,0);ld.visible=false;for(const dx of[-2.2,1,2.2])for(const dz of[-1,1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,10),M.tyre);w.rotation.x=Math.PI/2;w.position.set(dx,.4,dz);g.add(w)}g.userData.load=ld;return g};
  const addTruck=i=>{const g=truckG();const t=addAgent({id:'tt'+i,name:`TT-${String(i+1).padStart(2,'0')}`,sub:'Terminal truck',g,pts:[[-56,QUAY-3],[40,QUAY-3],[40,-2],[-56,-2]],maxSpeed:5+i*.2,lane:'road',loaded:false});t.pos.set(-56+i*18,QUAY-3);t.pos.y=QUAY-3;t.i=1;trucks.push(t);return t};
  for(let i=0;i<3;i++)addTruck(i);c.addTruck=addTruck;lane(-56,QUAY-3,40,QUAY-3);lane(-56,-2,40,-2);
  // tug
  {const g=new THREE.Group();world.add(g);box(g,4,1.4,2,M.dark,0,-.3,0);box(g,1.6,1.4,1.6,M.acc,-.6,1.1,0);addAgent({id:'tug',name:'Tug Kaveri',sub:'Harbour tug',g,pts:[[-60,SHIP_Z+14],[60,SHIP_Z+14],[60,SHIP_Z+30],[-60,SHIP_Z+30]],maxSpeed:3.5,lane:'sea',off:0})}
 },
 apply(c){const u=c.G.up;c.craneMul=1-.15*u.crane;c.rtgMul=1-.25*Math.min(1,u.rtg)*(.5+u.rtg/6);c.turnMul=1-.2*u.dredge;c.passive=40*u.railx;c.priceMul=(1+.1*u.gate)*(c.G.active==='reefer'?1+.2*u.cold:1);while(trucks.length<3+u.truck)c.addTruck(trucks.length)},
 priceMul:c=>c.priceMul||1,rate:c=>cranes.length/ (38*(c.craneMul||1))*c.price(c.G.active)*.8+(c.passive||0),
 tick(c,dt){const t=c.simT;const pos=c.seaGeo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);pos.setZ(i,Math.sin(x*.12+t*1.2)*.25+Math.cos(y*.18+t*.9)*.2)}pos.needsUpdate=true;
  const wxMul=c.WX.name==='Clear'||c.WX.name==='Heatwave'?1:.6;
  for(const k of cranes){const ship=k.ship;if(ship.status!=='alongside'||ship.left<=0){k.phase='idle';k.status='idle';k.trolley.position.z=lerp(k.trolley.position.z,0,dt);continue}k.status='running';k.cycle=38*c.craneMul/wxMul;k.t+=dt/k.cycle;const p=k.t%1;
    const tz=p<.2?lerp(0,SHIP_Z-(QUAY-6),smooth(p/.2)):p<.5?SHIP_Z-(QUAY-6):p<.7?lerp(SHIP_Z-(QUAY-6),0,smooth((p-.5)/.2)):0;k.trolley.position.z=tz;
    const sy=p<.2?-10:p<.3?lerp(-10,-13,smooth((p-.2)/.1)):p<.4?-13:p<.5?lerp(-13,-10,smooth((p-.4)/.1)):p<.7?-10:p<.8?lerp(-10,-14.4,smooth((p-.7)/.1)):p<.9?-14.4:lerp(-14.4,-10,smooth((p-.9)/.1));k.spreader.position.y=sy;k.cable.scale.y=(-sy)/10;k.cable.position.y=sy/2;
    k.phase=p<.2?'to ship':p<.5?'lifting':p<.7?'to quay':p<.9?'setting down':'returning';
    if(p>=.35&&p<.85&&!k.held.visible){k.held.visible=true;const b=ship.cargo.pop();if(b)b.visible=false;ship.left=ship.cargo.filter(b=>b.visible).length}
    if(p>=.85&&k.held.visible){k.held.visible=false;k.moves++;moves++;movesH++;const tr=trucks.find(x=>!x.loaded&&Math.abs(x.pos.x-k.x)<14&&Math.abs(x.pos.y-(QUAY-3))<1);if(tr){tr.loaded=true;tr.g.userData.load.visible=true;tr.dwell=1.2;tr.dwellStatus='loading'}c.earn(Math.round(c.price(c.G.active)),k.spreader)}}
  for(const tr of trucks){if(tr.loaded&&tr.pos.y<0&&tr.status==='moving'){const st=stacks.find(s=>Math.abs(s.x-tr.pos.x)<2&&s.n<s.max);if(st){tr.loaded=false;tr.g.userData.load.visible=false;tr.dwell=2*c.rtgMul;tr.dwellStatus='stacking';c.stackBox(st);const r=rtgs[st.z<-20?1:0];r.target=st.x;c.burst(tr.g,2,.4,.6)}}
    if(!tr.loaded&&tr.pos.y>5&&tr.status==='moving'&&Math.random()<dt*.02){tr.dwell=1;tr.dwellStatus='waiting'}}
  rtgs.forEach(r=>{r.g.position.x=lerp(r.g.position.x,r.target||-48,dt*.8)});
  for(const s of ships){if(s.status==='alongside'&&s.left<=0){s.status='departing';s.t=0;c.addAlert('ok',`${s.name} completed`,'Pilot aboard · tug assisting')}
    if(s.status==='departing'){s.t+=dt;s.g.position.x=s.home+smooth(Math.min(1,s.t/40))*-160;if(s.t>40){s.status='inbound';s.t=0;s.cargo.forEach(b=>b.visible=true);s.left=s.cargo.length;s.name=s.name.includes('Star')?'MV Marina Star':'MV Coromandel'}}
    else if(s.status==='inbound'){s.t+=dt;const T=30*(c.turnMul||1);s.g.position.x=s.home+160*(1-smooth(Math.min(1,s.t/T)));if(s.t>T){s.status='alongside';c.addAlert('ok',`${s.name} alongside ${s.berth}`,`${s.left} boxes to discharge`,{kind:'station',id:s.id})}}}
  if(Math.random()<dt*.01){const k=cranes[Math.floor(Math.random()*cranes.length)];c.addAlert('warn',`${k.name} wind hold`,'Gusts over 20 m/s on the boom',{kind:'station',id:k.id})}
 },
 slow(c){movesH*=.97;const mph=Math.round(movesH*12);c.kpi(0,`${mph}<small>/h</small>`,`${cranes.filter(k=>k.status==='running').length} cranes working`,mph<60?'warn':'');c.spark(0,mph);const occ=ships.filter(s=>s.status==='alongside').length/2*100;c.kpi(1,`${occ.toFixed(0)}<small>%</small>`,ships.map(s=>s.berth+' '+s.status).join(' · '),occ<50?'warn':'');c.spark(1,occ);const yu=stacks.reduce((a,s)=>a+s.n,0)/stacks.reduce((a,s)=>a+s.max,0)*100;c.kpi(2,`${yu.toFixed(0)}<small>%</small>`,`${stacks.reduce((a,s)=>a+s.n,0)} boxes on the ground`,yu>85?'bad':yu>70?'warn':'');c.spark(2,yu);if(yu>95)stacks.forEach(s=>{if(s.n>8){const b=s.boxes.pop();b.parent.remove(b);s.n--}})},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,level:a.status==='yielding'?'warn':'',stats:[['Load',a.loaded?'1 × 40 ft':'empty'],['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Trips',Math.floor(a.trips)],['Yields',a.yield]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.trolley)return{type:s.type,status:s.status==='running'?s.phase:'idle',level:s.status==='running'?'':'warn',stats:[['Cycle',s.cycle.toFixed(0)+' s'],['Moves today',s.moves],['Vessel',s.ship.name],['Uptime',s.uptime.toFixed(1)+' %']],bar:(s.t%1)*100};
  if(s.cargo)return{type:s.type,status:s.status,stats:[['Berth',s.berth],['Boxes left',s.left],['Draft','11.2 m'],['Line','Coromandel Lines']],bar:(1-s.left/s.cargo.length)*100};
  if(s.row!==undefined)return{type:s.type,status:'stacking',stats:[['Block',s.row===0?'A row':'B row'],['Moves','—'],['Stack height','3 high']]};
  return{type:s.type,status:'open',stats:[['Throughput',moves+' moves'],['Shift','A']]}}
});
</script></body></html>
