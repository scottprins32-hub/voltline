<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Parkline — theme park operations</title>
<meta name="description" content="Parkline: a live 3D theme park you can run. World 14 of Voltline Worlds."><meta name="theme-color" content="#f3f4f6">

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import {createWorld,THREE,rnd,lerp,clamp,smooth} from './kit.js';
const rides=[],guests=[],stalls=[];let coaster,wheel,flume,carousel,mono,parade,revenue=0,guestsIn=0,paradeT=0;
const CYC=['Loading','Dispatch','Lift','Ride','Brake','Unload'];
createWorld({
 id:'parkline',num:14,name:'Parkline',tag:'Theme park operations',site:'Wonderla Bay · 42 acres',accent:'#F43F5E',accentRgb:'244,63,94',accentInk:'#be123c',
 wordmark:'Park<b>line</b>',intro:'A coaster with a loop, a Ferris wheel, a log flume, a carousel and a lake. <b>Every ride dispatch sells tickets.</b> Shorten queues, light the night, bank Charter.',
 ldSteps:['testing the coaster','inflating the balloons','filling the flume','opening the gates'],plantName:'Park office',productLabel:'Tickets',
 sky:0xfdf4f2,groundStops:['#fbf4ee','#f0e2d6','#d8c4b2'],pal:{wall:0xfdf6ee,asphalt:0xd7cfc4,floor:0xefe6da,water:0x74b9d8},temps:[31,26,22,38],positiveWx:['Festive night'],wx:{rain:'Rain',fog:'Windy · holds',heat:'Festive night'},particle:0xfff2a8,lamps:[[0,0],[-30,-20],[30,-20]],
 overview:{t:[0,0,-4],z:52},introFrom:[0,2,34],
 areas:{ent:{num:'LAND 01',label:'Entrance',t:[0,1,34],z:16},thrill:{num:'LAND 02',label:'Thrill zone',t:[-30,6,-20],z:24},water:{num:'LAND 03',label:'Water zone',t:[30,1,-18],z:18},kids:{num:'LAND 04',label:'Kids zone',t:[30,1,16],z:16},lake:{num:'LAND 05',label:'Lake',t:[-30,0,16],z:20}},
 kpis:[{label:'Guests in park'},{label:'Average wait'},{label:'Revenue today'}],
 products:{day:{name:'Day ticket',sub:'all rides',price:45,unlock:0,unit:'per rider',svg:'<rect x="8" y="8" width="28" height="14" rx="3" fill="currentColor" opacity=".9"/>'},fast:{name:'Fast pass',sub:'skip the line · +60%',price:72,unlock:55000,unit:'per rider',svg:'<path d="M26 4 12 18h8l-2 10 14-14h-8z" fill="currentColor" opacity=".9"/>'},vip:{name:'VIP night',sub:'fireworks package · 3×',price:135,unlock:280000,unit:'per rider',svg:'<circle cx="22" cy="15" r="9" fill="currentColor" opacity=".9"/>'}},
 upgrades:[{id:'train',name:'Second coaster train',fx:'Coaster capacity doubled',cost:9000},{id:'queue',name:'Queue management',fx:'Waits 20% shorter per tier',cost:6000},{id:'lights',name:'Ride lights',fx:'Full price after dark',cost:8000},{id:'parade',name:'Parade',fx:'Parade every evening · +500 ⚡ per float',cost:7500},{id:'stalls',name:'More stalls',fx:'+55 ⚡/s passive per tier',cost:6500},{id:'mono',name:'Monorail capacity',fx:'+6 guests in park per tier',cost:7000},{id:'fire',name:'Fireworks',fx:'Festive nights pay 2×',cost:12000}],
 tabs:[{id:'rides',label:'Rides',cols:['Ride','Cycle','Riders/h','Queue','Status'],rows:c=>rides.map(r=>({pick:{kind:'station',id:r.id},cells:[r.name,CYC[r.ph],r.rph,Math.round(r.queue),r.closed?'closed':'running']})),meta:c=>guestsIn+' guests'},
       {id:'queues',label:'Queues',cols:['Ride','Waiting','Wait','Capacity','Status'],rows:c=>rides.map(r=>({pick:{kind:'station',id:r.id},cells:[r.name,Math.round(r.queue),Math.round(r.queue/r.cap*r.cycle/60*10)+' min',r.cap,r.queue>40?'crowded':'ok']}))},
       {id:'stalls',label:'Stalls',cols:['Stall','Item','Sold','Queue','Status'],rows:c=>stalls.map(s=>({pick:{kind:'station',id:s.id},cells:[s.name,s.item,s.sold,s.q,'open']}))}],
 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  // paths
  lane(0,40,0,-30);lane(-40,0,40,0);lane(-30,30,30,30);lane(-30,-30,30,-30);
  // entrance plaza
  {const g=new THREE.Group();g.position.set(0,0,38);world.add(g);for(const dx of[-8,8])box(g,1.2,7,1.2,M.white,dx,0,0);box(g,18,1.2,1.2,M.acc,0,7,0);box(g,6,2.6,2,M.white,-5,0,2);box(g,6,2.6,2,M.white,5,0,2);for(let i=-4;i<=4;i+=2)box(g,.2,.3,1.6,M.yellow,i,1.4,-1.2);addStation({id:'ent',name:'Entrance plaza',type:'8 turnstiles · ticketing',obj:g,pos:new THREE.Vector3(0,3,38)});stencil('LAND 01 ENTRANCE',0,46,12)}
  // roller coaster with lift hill and loop
  {const P=[[-50,0,-6],[-44,22,-14],[-36,10,-24],[-26,2,-30],[-18,10,-26],[-14,18,-20],[-18,24,-14],[-24,20,-10],[-26,10,-14],[-20,3,-24],[-10,4,-32],[0,8,-34],[-8,2,-26],[-22,1,-10],[-40,1,-2]].map(p=>new THREE.Vector3(...p));coaster={curve:new THREE.CatmullRomCurve3(P,true,'centripetal',.5)};coaster.len=coaster.curve.getLength();
    const g=new THREE.Group();world.add(g);const N=160;const pts=coaster.curve.getSpacedPoints(N);for(let i=0;i<N;i++){const a=pts[i],b=pts[(i+1)%N];const m=new THREE.Mesh(new THREE.BoxGeometry(a.distanceTo(b)+.2,.3,1.6),M.acc);m.position.copy(a).lerp(b,.5);m.lookAt(b);m.rotateY(Math.PI/2);m.castShadow=true;g.add(m);if(i%8===0&&a.y>1.5){const s=box(g,.3,a.y,.3,M.white,a.x,0,a.z);}}
    box(g,10,3,5,M.white,-44,0,-2);box(g,10.4,.3,5.4,M.acc,-44,3,-2);
    const mkTrain=off=>{const tg=new THREE.Group();g.add(tg);const cars=[];for(let k=0;k<4;k++){const cg=new THREE.Group();tg.add(cg);box(cg,2.2,.9,1.4,k?M.acc:M.yellow,0,0,0);box(cg,.8,.5,1.2,M.dark,.4,.9,0);cars.push(cg)}return{g:tg,cars,t:off,v:4}};coaster.trains=[mkTrain(0)];coaster.mk=mkTrain;
    rides.push(addStation({id:'coaster',name:'Thunder Loop',type:'Steel coaster · 1,200 m',obj:g,pos:new THREE.Vector3(-30,8,-18),ph:0,phT:0,cycle:40,cap:24,rph:0,queue:30,closed:false,kind:'coaster'}));stencil('LAND 02 THRILL ZONE',-30,-38,14)}
  // Ferris wheel
  {const g=new THREE.Group();g.position.set(-30,0,16);world.add(g);for(const dx of[-3,3]){const leg=box(g,.6,16,.6,M.white,dx,0,0);leg.rotation.z=dx>0?-.12:.12}const hub=new THREE.Group();hub.position.set(0,15,0);g.add(hub);const ring=new THREE.Mesh(new THREE.TorusGeometry(12,.35,8,32),M.acc);hub.add(ring);const cabins=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const sp=box(hub,.25,12,.25,M.white,0,0,0);sp.rotation.z=a;sp.position.set(Math.cos(a+Math.PI/2)*6,Math.sin(a+Math.PI/2)*6,0);const cab=new THREE.Group();hub.add(cab);box(cab,1.8,1.6,1.4,[M.yellow,M.acc,M.white][i%3],0,-.8,0);cabins.push({g:cab,a})}wheel={hub,cabins};
    rides.push(addStation({id:'wheel',name:'Bay Wheel',type:'Observation wheel · 10 cabins',obj:g,pos:new THREE.Vector3(-30,15,16),ph:0,phT:0,cycle:60,cap:60,rph:0,queue:18,closed:false,kind:'wheel'}));stencil('LAND 05 LAKE · WHEEL',-30,32,14)}
  // lake + paddle boats
  {const lake=new THREE.Mesh(new THREE.CircleGeometry(14,32),M.water);lake.rotation.x=-Math.PI/2;lake.position.set(-32,.04,-2);lake.receiveShadow=true;world.add(lake);for(let i=0;i<3;i++){const g=new THREE.Group();world.add(g);box(g,2.2,.6,1.4,[M.yellow,M.acc,M.white][i],0,0,0);box(g,.8,.8,.8,M.dark,-.2,.6,0);const a=addAgent({id:'boat'+i,name:'Paddle boat '+(i+1),sub:'Lake loop',g,pts:[[-40,-8],[-24,-8],[-24,4],[-40,4]],maxSpeed:1.2+i*.2,lane:'lake',off:0});a.pos.set(-40+i*5,-8+i*4);a.i=1}}
  // log flume with splash drop
  {const g=new THREE.Group();g.position.set(30,0,-18);world.add(g);box(g,30,.8,3,M.white,0,0,6);box(g,30,.6,2.4,M.water,0,.3,6,{shadow:false});const ramp=box(g,12,.8,3,M.white,8,0,-6);ramp.rotation.z=.5;box(g,14,.8,3,M.white,-6,6,-6);box(g,3,.8,14,M.white,-13,3,0);const pool=box(g,16,.4,8,M.water,6,0,-2,{shadow:false});const logs=[];for(let i=0;i<3;i++){const lg=new THREE.Group();g.add(lg);box(lg,2.6,.8,1.1,new THREE.MeshStandardMaterial({color:0x8b5a2b}),0,0,0);box(lg,.6,.6,.6,M.yellow,0,.8,0);logs.push({g:lg,t:i/3})}flume={logs,pool};
    rides.push(addStation({id:'flume',name:'Timber Falls',type:'Log flume · 12 m drop',obj:g,pos:new THREE.Vector3(30,3,-18),ph:0,phT:0,cycle:45,cap:18,rph:0,queue:22,closed:false,kind:'flume'}));stencil('LAND 03 WATER ZONE',30,-30,14)}
  // carousel
  {const g=new THREE.Group();g.position.set(30,0,16);world.add(g);cyl(g,6,6,.5,M.white,0,0,0,24);const top=new THREE.Mesh(new THREE.ConeGeometry(6.6,2.6,24),M.acc);top.position.y=6;top.castShadow=true;g.add(top);cyl(g,.4,.4,5,M.white,0,.5,0,10);const plat=new THREE.Group();plat.position.y=.5;g.add(plat);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;box(plat,.15,4,.15,M.yellow,Math.cos(a)*4.5,0,Math.sin(a)*4.5);box(plat,1.6,.9,.6,[M.acc,M.white][i%2],Math.cos(a)*4.5,1.2,Math.sin(a)*4.5)}carousel={plat};
    rides.push(addStation({id:'carousel',name:'Royal Carousel',type:'Carousel · 32 horses',obj:g,pos:new THREE.Vector3(30,3,16),ph:0,phT:0,cycle:30,cap:32,rph:0,queue:10,closed:false,kind:'carousel'}));stencil('LAND 04 KIDS ZONE',30,30,12)}
  // food court stalls
  [['Dosa Corner','masala dosa',-12,34],['Candy Cloud','cotton candy',12,34],['Chaat Street','pani puri',-12,-2],['Ice Castle','kulfi',12,-2]].forEach(([n,it,x,z],i)=>{const g=new THREE.Group();g.position.set(x,0,z);world.add(g);box(g,4,2.4,3,M.white,0,0,0);box(g,4.6,.3,3.6,[M.acc,M.yellow][i%2],0,2.4,0);box(g,4,.8,.2,[M.yellow,M.acc][i%2],0,1.4,1.6);stalls.push(addStation({id:'stall'+i,name:n,type:'Food stall',obj:g,pos:new THREE.Vector3(x,2,z),item:it,sold:0,q:rnd(0,6)}))});
  // monorail loop above the paths
  {const g=new THREE.Group();world.add(g);const R=38;for(let i=0;i<40;i++){const a=i/40*Math.PI*2,a2=(i+1)/40*Math.PI*2;const x=Math.cos(a)*R,z=Math.sin(a)*R*.8,x2=Math.cos(a2)*R,z2=Math.sin(a2)*R*.8;const m=box(g,Math.hypot(x2-x,z2-z)+.3,.5,1.4,M.white,(x+x2)/2,8,(z+z2)/2);m.rotation.y=-Math.atan2(z2-z,x2-x);if(i%4===0)cyl(g,.4,.5,8,M.white,x,0,z,8)}const tg=new THREE.Group();g.add(tg);for(let k=0;k<3;k++)box(tg,4,1.8,1.6,k?M.white:M.acc,-4.4*k,9,0);mono={g:tg,t:0,R};addStation({id:'mono',name:'Sky Monorail',type:'Loop · 3 cars',obj:tg,pos:new THREE.Vector3(R,10,0)})}
  // guests
  const mkGuest=i=>{const g=new THREE.Group();world.add(g);box(g,.5,1,.4,[M.acc,M.yellow,M.white,M.mid,new THREE.MeshStandardMaterial({color:0x60a5fa})][i%5],0,.3,0);sph(g,.22,M.dark,0,1.5,0);const bal=sph(g,.35,[M.acc,M.yellow,new THREE.MeshStandardMaterial({color:0x60a5fa})][i%3],.4,2.8,0);bal.visible=i%3===0;const loops=[[[0,36],[0,0],[-30,0],[-30,-28],[0,-28],[0,0]],[[0,36],[0,30],[30,30],[30,0],[30,-28],[0,-28],[0,0]],[[0,36],[0,30],[-30,30],[-30,0],[0,0]]];const a=addAgent({id:'g'+i,name:'Guest '+(i+1),sub:'Family of 3',g,pts:loops[i%3],maxSpeed:1.2+rnd(0,.6),lane:'path'+(i%4),off:rnd(-1.5,1.5),stopAt:[2,3],stopTime:rnd(4,9)});a.pos.set(0,36);a.i=1;guests.push(a);return a};
  for(let i=0;i<18;i++)mkGuest(i);c.mkGuest=mkGuest;
  for(const [x,z] of[[-48,36],[48,36],[-48,-40],[48,-40],[16,44],[-16,44]])tree(x,z,1.2);
  parade={g:new THREE.Group(),on:false,t:0};world.add(parade.g);for(let k=0;k<3;k++){const f=new THREE.Group();parade.g.add(f);box(f,5,2.5,2.4,[M.acc,M.yellow,M.white][k],0,.4,0);sph(f,1,[M.yellow,M.acc,M.acc][k],0,3.5,0);f.position.x=-7*k}parade.g.visible=false;
 },
 apply(c){const u=c.G.up;c.queueMul=1-.2*u.queue;c.lightsOk=!!u.lights;c.paradeOk=!!u.parade;c.passive=55*u.stalls;c.fireMul=u.fire?2:1;if(u.train&&coaster.trains.length<2)coaster.trains.push(coaster.mk(.5));while(guests.length<18+6*u.mono)c.mkGuest(guests.length)},
 priceMul:c=>((c.nightT>.5&&!c.lightsOk)?.6:1)*(c.WX.name==='Festive night'?(c.fireMul||1):1),rate:c=>rides.reduce((a,r)=>a+r.cap/r.cycle,0)*c.price(c.G.active)*.6+(c.passive||0),
 tick(c,dt){const t=c.simT;const windy=c.WX.name==='Windy · holds',rain=c.WX.name==='Rain';guestsIn=guests.length*3+Math.round(Math.sin(t*.02)*8);
  // ride cycles → revenue on dispatch
  for(const r of rides){r.closed=(windy&&r.tag==='coaster')||(rain&&r.tag==='flume');if(r.closed)continue;r.phT+=dt;const segs=[.2,.05,.25,.3,.08,.12];const cyc=r.cycle*(c.queueMul||1);if(r.phT>segs[r.ph]*cyc){r.ph=(r.ph+1)%6;r.phT=0;if(r.ph===1){const riders=Math.round(Math.min(r.cap*(r.tag==='coaster'?coaster.trains.length:1),r.queue+8));r.queue=Math.max(0,r.queue-riders);r.rph=Math.round(riders*3600/cyc);const v=Math.round(riders*c.price(c.G.active));c.earn(v,r.obj);revenue+=v;c.log('ok',`${r.name} dispatched · ${riders} riders`)}}
    r.queue=clamp(r.queue+dt*(.6+Math.sin(t*.05+r.cap)*.3)*(c.nightT>.5?.5:1),0,90)}
  // coaster trains along the curve, speed from height
  coaster.trains.forEach(tr=>{const p=coaster.curve.getPointAt(tr.t);const lift=p.y>3&&tr.t<.18;tr.v=lift?4:clamp(Math.sqrt(2*9.8*Math.max(.5,24-p.y))*.9,6,22);if(rides[0].closed)tr.v=0;tr.t=(tr.t+tr.v*dt/coaster.len)%1;tr.cars.forEach((cg,k)=>{const u=((tr.t-k*2.4/coaster.len)%1+1)%1;const q=coaster.curve.getPointAt(u),q2=coaster.curve.getPointAt((u+.004)%1);cg.position.copy(q).add(new THREE.Vector3(0,.7,0));cg.lookAt(q2.x,q2.y+.7,q2.z);cg.rotateY(Math.PI/2)});if(tr.v>16&&Math.random()<dt*4)c.burst(tr.cars[0],1,.5,.5)});
  wheel.hub.rotation.z+=dt*.25;wheel.cabins.forEach(cb=>{cb.g.position.set(Math.cos(cb.a+Math.PI/2+wheel.hub.rotation.z*0)*12,Math.sin(cb.a+Math.PI/2)*12,0);cb.g.rotation.z=-wheel.hub.rotation.z});
  flume.logs.forEach(l=>{l.t=(l.t+dt*.05)%1;const u=l.t;let x,y,z;if(u<.4){x=-13+(u/.4)*0;x=lerp(-13,-13,0);y=.6+(u/.4)*6;z=lerp(6,-6,u/.4);x=-13}else if(u<.55){const f=(u-.4)/.15;x=lerp(-13,2,f);y=6.6;z=-6}else if(u<.68){const f=(u-.55)/.13;x=lerp(2,14,f);y=lerp(6.6,.6,f*f);z=-6;if(f>.9&&Math.random()<dt*40)c.burst(flume.pool,6,3,4)}else{const f=(u-.68)/.32;x=lerp(14,-13,f);y=.6;z=lerp(-6,6,Math.min(1,f*3))}l.g.position.set(x,y,z)});
  carousel.plat.rotation.y+=dt*.6;mono.t=(mono.t+dt*.03)%1;{const a=mono.t*Math.PI*2;mono.g.position.set(Math.cos(a)*mono.R,0,Math.sin(a)*mono.R*.8);mono.g.rotation.y=-a-Math.PI/2}
  // parade in the evening
  if(c.paradeOk&&c.nightT>.4&&c.nightT<.8&&!parade.on&&t-paradeT>120){parade.on=true;parade.t=0;paradeT=t;parade.g.visible=true;c.addAlert('ok','Parade starting','Main street · 3 floats')}
  if(parade.on){parade.t+=dt;const f=parade.t/40;parade.g.position.set(0,0,36-f*66);if(f>=1){parade.on=false;parade.g.visible=false;c.earn(1500,parade.g);revenue+=1500}else if(Math.random()<dt*6)c.burst(parade.g,2,2,3)}
  if(c.WX.name==='Festive night'&&c.nightT>.5&&Math.random()<dt*1.2){const s=stalls[Math.floor(Math.random()*4)];c.burst(s.obj,12,6,12)}
  stalls.forEach(s=>{if(Math.random()<dt*.15){s.sold++;s.q=clamp(s.q+rnd(-1,1),0,9)}})},
 slow(c){c.kpi(0,`${c.fmt(guestsIn*40)}`,`${guests.length*3} on the paths · monorail ${Math.round(mono.t*100)}%`,'');c.spark(0,guestsIn);const w=rides.reduce((a,r)=>a+r.queue/r.cap*r.cycle/60*10,0)/rides.length;c.kpi(1,`${w.toFixed(0)}<small>min</small>`,`${rides.filter(r=>r.closed).length} rides on hold`,w>25?'bad':w>15?'warn':'');c.spark(1,w);c.kpi(2,`${c.fmt(revenue)}<small>⚡</small>`,`${stalls.reduce((a,s)=>a+s.sold,0)} stall sales`,'');c.spark(2,revenue)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,stats:[['Speed',(a.speed*3.6).toFixed(1)+' km/h'],['Rides so far',Math.floor(a.trips*4)],['Spend','₹'+(420+Math.floor(a.trips*180))]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.cycle)return{type:s.type,status:s.closed?'closed · weather':CYC[s.ph].toLowerCase(),level:s.closed?'bad':s.queue>40?'warn':'',stats:[['Queue',Math.round(s.queue)],['Wait',Math.round(s.queue/s.cap*s.cycle/60*10)+' min'],['Riders/h',s.rph],['Capacity',s.cap+(s.tag==='coaster'?' × '+coaster.trains.length:'')],['Cycle',s.cycle+' s']],bar:s.phT/(s.cycle*[.2,.05,.25,.3,.08,.12][s.ph])*100};
  if(s.item)return{type:s.type,status:'open',stats:[['Item',s.item],['Sold today',s.sold],['Queue',s.q]]};
  return{type:s.type,status:'open',stats:[['Guests in park',c.fmt(guestsIn*40)],['Revenue',c.fmt(revenue)+' ⚡']]}}
});
</script></body></html>
