<script type="module">
import {createWorld,THREE,rnd,lerp,clamp,smooth} from './kit.js';
const LINES=[-30,0,30];const kitchens=[],riders=[],buildings=[],orders=[];let orderSeq=4120,ordersH=0,delivered=0,sumTime=0,lights=[],pins;
const DISHES=['Chettinad chicken','Paneer tikka dabba','Veg biryani','Masala dosa set','Mutton biryani','Filter coffee + vada','Ghee roast','Curd rice combo'];

createWorld({
 id:'dabba',num:5,name:'Dabba',tag:'Cloud kitchen delivery city',site:'Anna Nagar · 3 kitchens',accent:'#E8452C',accentRgb:'232,69,44',accentInk:'#9f2a15',
 wordmark:'Dab<b>ba</b>',intro:'Three cloud kitchens, a street grid and a fleet of scooters. <b>Every delivered order pays.</b> Add riders, cook faster, bank Charter.',

 sky:0xf6f2ec,groundStops:['#f7f3ec','#eadfd0','#d2c3ad'],pal:{wall:0xf8f1e6,asphalt:0xb8b6b3,floor:0xe4ddd1},temps:[35,28,24,41],wx:{rain:'Monsoon',fog:'Smog',heat:'Summer'},lamps:[[-30,-15],[30,15],[0,0]],
 overview:{t:[0,0,0],z:52},introFrom:[-30,2,-15],
 areas:{k:{num:'ZONE 01',label:'Kitchens',t:[-30,2,-15],z:16},tech:{num:'ZONE 02',label:'Tech park',t:[40,4,-40],z:20},temple:{num:'ZONE 03',label:'Temple',t:[-42,4,42],z:18},metro:{num:'ZONE 04',label:'Metro',t:[0,4,-48],z:18},park:{num:'ZONE 05',label:'Park',t:[42,1,42],z:18}},

 upgrades:[{id:'rider',name:'Extra rider',fx:'+1 scooter on the road per tier',cost:3000},{id:'speed',name:'Faster scooters',fx:'Riders 15% faster per tier',cost:4000},{id:'cook',name:'Kitchen capacity',fx:'Cooking 20% faster per tier',cost:5000},{id:'surge',name:'Surge pricing',fx:'+10% per order',cost:7000},{id:'dark',name:'Dark store',fx:'+30 ⚡/s passive per tier',cost:6000},{id:'rain',name:'Rain gear',fx:'Halves the monsoon penalty',cost:5500},{id:'fest',name:'Festival menu',fx:'Full price after dark',cost:9000}],
 tabs:[{id:'orders',label:'Orders',cols:['Order','Dish','Total','Distance','Status'],rows:c=>orders.slice(-8).reverse().map(o=>({pick:{kind:'station',id:o.dest.id},cells:['#'+o.id,o.dish,'₹'+o.total,o.km.toFixed(1)+' km',o.status]})),meta:c=>delivered+' delivered'},
       {id:'riders',label:'Riders',cols:['Rider','Order','Speed','Done','Status'],rows:c=>riders.map(r=>({pick:{kind:'agent',agent:r},cells:[r.name,r.order?'#'+r.order.id:'—',(r.speed*3.6).toFixed(0)+' km/h',r.done,r.order?r.order.status:'idle']}))},
       {id:'kitch',label:'Kitchens',cols:['Kitchen','Cooking','Queue','Today','Status'],rows:c=>kitchens.map(k=>({pick:{kind:'station',id:k.id},cells:[k.name,k.cooking.length,k.queue.length,k.today,k.cooking.length?'cooking':'idle']}))}],
 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  // streets
  for(const v of LINES){box(world,130,.2,6,M.asphalt,0,-.1,v);box(world,6,.2,130,M.asphalt,v,-.1,0)}
  for(const x of LINES)for(const z of LINES){for(let k=-2;k<=2;k++){box(world,.9,.05,3,M.white,x+k*1.3,.12,z-4.2,{shadow:false});box(world,.9,.05,3,M.white,x+k*1.3,.12,z+4.2,{shadow:false});box(world,3,.05,.9,M.white,x-4.2,.12,z+k*1.3,{shadow:false});box(world,3,.05,.9,M.white,x+4.2,.12,z+k*1.3,{shadow:false})}
    const g=new THREE.Group();g.position.set(x+3.6,0,z+3.6);world.add(g);box(g,.2,4,.2,M.dark,0,0,0);const r=box(g,.5,.5,.3,new THREE.MeshStandardMaterial({color:0xef4444,emissive:0xef4444,emissiveIntensity:1}),0,4,0,{shadow:false});const gr=box(g,.5,.5,.3,M.accGlow,0,3.4,0,{shadow:false});lights.push({r,gr,x,z,t:rnd(0,8)})}
  // blocks: buildings in the 4x4 cells between/around streets
  const cells=[];for(let i=-2;i<2;i++)for(let j=-2;j<2;j++)cells.push([i*30+15,j*30+15]);
  const bld=(x,z,w,h,d,mat,name,type,id)=>{const g=new THREE.Group();g.position.set(x,0,z);world.add(g);box(g,w,h,d,mat,0,0,0);for(let y=1.6;y<h-1;y+=2.6)for(let k=-w/2+1.5;k<w/2-1;k+=2.4){const win=box(g,1.2,1.1,.15,M.window,k,y,d/2+.05,{shadow:false});win.userData.win=1}box(g,w+.4,.3,d+.4,M.grey,0,h,0);contact(w+4,d+4,x,z,.16);
    const b=addStation({id,name,type,obj:g,pos:new THREE.Vector3(x,h/2,z),door:[nearLine(x),z+(z<nearLine(z)?-1:1)*0],x,z,orders:0});buildings.push(b);return b};
  let bi=0;cells.forEach(([cx,cz],ci)=>{if(ci===5){return}if(ci===6){return}for(let k=0;k<3;k++){const ox=rnd(-9,9),oz=rnd(-9,9);const kind=['apartment','office','shop'][k%3];const h=kind==='shop'?4:kind==='office'?rnd(8,14):rnd(9,18);const b=bld(cx+ox,cz+oz,kind==='shop'?6:rnd(6,9),h,kind==='shop'?6:rnd(6,9),kind==='shop'?M.white:M.wall,`${['Lakshmi','Sai','Ganga','Kaveri','Meenakshi','Marina','Vel','Sri'][bi%8]} ${kind==='apartment'?'Apartments':kind==='office'?'Towers':'Stores'}`,kind==='shop'?'Shops with awnings':kind==='office'?'Offices · 6 floors':'Apartments · 48 flats','b'+bi);if(kind==='shop')box(b.obj,6.4,.2,2,M.acc,0,2.6,4);bi++}});
  // kitchens (on cells 5 and 6 edges), tech park, temple, metro, park
  [[-30,-15],[0,15],[30,-15]].forEach(([x,z],i)=>{const g=new THREE.Group();const bx=x+(i%2?8:-8),bz=z;g.position.set(bx,0,bz);world.add(g);box(g,9,4.5,7,M.white,0,0,0);box(g,9.4,.3,7.4,M.dark,0,4.5,0);box(g,9,.6,.5,M.acc,0,3.6,3.6);for(let k=-2;k<=2;k+=2){const f=cyl(g,.8,.8,.5,M.mid,k,4.8,0,10);f.userData.fan=1;cyl(g,.9,.9,.1,M.dark,k,4.75,0,10)}
    const glow=box(g,8.4,.15,6.4,M.accGlow,0,4.85,0,{shadow:false});glow.visible=false;lane(bx,z,x,z);const k=addStation({id:'k'+i,name:['Dabba Kitchen North','Dabba Kitchen Central','Dabba Kitchen East'][i],type:'Cloud kitchen · 6 woks',obj:g,pos:new THREE.Vector3(bx,3,bz),door:[x,z],glow,fans:g.children.filter(m=>m.userData.fan),cooking:[],queue:[],today:0});kitchens.push(k)});
  stencil('ZONE 01 KITCHENS · RIDER BAY',-30,-24,18);
  {const g=new THREE.Group();g.position.set(45,0,-45);world.add(g);box(g,22,16,16,M.glass,0,0,0,{shadow:false});box(g,22,16,16,M.wall,0,0,0);for(let y=1.5;y<15;y+=2.2)for(let k=-9;k<10;k+=2.2){const w=box(g,1.6,1.3,.2,M.window,k,y,8.1,{shadow:false});w.userData.win=1}box(g,23,.4,17,M.grey,0,16,0);const b=addStation({id:'tech',name:'Nexus Tech Park',type:'IT campus · 4,000 desks',obj:g,pos:new THREE.Vector3(45,8,-45),door:[30,-45],x:45,z:-45,orders:0});buildings.push(b);stencil('ZONE 02 TECH PARK',45,-33,14)}
  {const g=new THREE.Group();g.position.set(-45,0,45);world.add(g);for(let i=0;i<6;i++)box(g,10-i*1.4,2.2,10-i*1.4,i%2?M.acc:M.wall,0,i*2.2,0);box(g,1.4,2,1.4,M.yellow,0,13.2,0);addStation({id:'temple',name:'Kapaleeshwarar gopuram',type:'Temple · prasadam counter',obj:g,pos:new THREE.Vector3(-45,8,45)});stencil('ZONE 03 TEMPLE',-45,34,10)}
  {const g=new THREE.Group();g.position.set(0,0,-50);world.add(g);for(const dx of[-8,8])box(g,1,6,1,M.white,dx,0,0);box(g,24,.8,6,M.floor,0,6,0);box(g,26,.4,8,M.acc,0,9.6,0);for(const dx of[-10,10])box(g,.4,3,.4,M.mid,dx,6.8,2);box(g,24,.2,.3,M.rail,0,6.8,-2);addStation({id:'metro',name:'Anna Nagar metro',type:'Elevated · 2 exits',obj:g,pos:new THREE.Vector3(0,6,-50)});stencil('ZONE 04 METRO',0,-40,10)}
  {const park=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({color:0xbfe3c0,roughness:1}));park.rotation.x=-Math.PI/2;park.position.set(45,.06,45);park.receiveShadow=true;world.add(park);for(const [x,z] of[[38,38],[52,40],[40,52],[53,53],[46,46]])tree(x,z,rnd(.8,1.3));addStation({id:'park',name:'Tower Park',type:'Public park · 6 acres',obj:null,pos:new THREE.Vector3(45,1,45)});stencil('ZONE 05 PARK',45,34,8)}
  for(const [x,z] of[[-60,-60],[60,60],[-60,15],[15,60]])tree(x,z,1);
  // pins pool
  pins=[];for(let i=0;i<8;i++){const p=new THREE.Mesh(new THREE.ConeGeometry(.9,2.2,8),M.accGlow);p.rotation.x=Math.PI;p.visible=false;p.castShadow=false;world.add(p);pins.push(p)}
  // riders + traffic
  const scooter=col=>{const g=new THREE.Group();world.add(g);box(g,1.7,.5,.7,col,0,.5,0);box(g,.5,.8,.5,M.dark,-.2,1,0);sph(g,.32,M.dark,-.2,1.9,0);box(g,.7,.7,.7,M.acc,-.9,1,0);for(const dx of[-.7,.7]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,10),M.tyre);w.rotation.x=Math.PI/2;w.position.set(dx,.34,0);g.add(w)}return g};
  const addRider=i=>{const k=kitchens[i%3];const r=addAgent({id:'r'+i,name:['Arjun','Priya','Kumar','Divya','Suresh','Meena','Vikram','Anjali','Ravi','Lakshmi'][i%10]+' · R'+(i+1),sub:'Rider',g:scooter(i%2?M.white:M.yellow),pts:[k.door,k.door],maxSpeed:5.5,lane:'street',loop:false,order:null,done:0,home:k});r.pos.set(...k.door);r.i=1;r.paused=true;riders.push(r);return r};
  for(let i=0;i<4;i++)addRider(i);c.addRider=addRider;
  const car=(col,w=3,h=1,d=1.5)=>{const g=new THREE.Group();world.add(g);box(g,w,h,d,col,0,.3,0);box(g,w*.5,.6,d*.9,M.glass,-.1,1.3,0,{shadow:false});for(const [dx,dz] of[[w/3,-d/2],[w/3,d/2],[-w/3,-d/2],[-w/3,d/2]]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.3,10),M.tyre);t.rotation.x=Math.PI/2;t.position.set(dx,.32,dz);g.add(t)}return g};
  [[-30,-60,-30,60],[30,60,30,-60],[-60,0,60,0]].forEach(([x0,z0,x1,z1],i)=>{for(let k=0;k<3;k++){const isAuto=k===1;const a=addAgent({id:`tr${i}${k}`,name:isAuto?`Auto ${i*3+k+1}`:`Car ${i*3+k+1}`,sub:'Traffic',g:car(isAuto?M.yellow:[M.white,M.dark,M.mid][k],isAuto?2.2:3,isAuto?1.3:1,isAuto?1.3:1.5),pts:[[x0,z0],[x1,z1]],maxSpeed:4+k*.5,lane:'street',loop:false,stopAt:[],stopTime:2});a.pos.set(lerp(x0,x1,k/3),lerp(z0,z1,k/3));a.i=1}});
 },
 apply(c){const u=c.G.up;c.speedMul=1+.15*u.speed;c.cookMul=1-.2*u.cook;c.priceMul=1+.1*u.surge;c.passive=30*u.dark;c.rainMul=u.rain?.5:1;c.festOk=!!u.fest;while(riders.length<4+u.rider)c.addRider(riders.length);riders.forEach(r=>r.maxSpeed=5.5*c.speedMul)},
 priceMul:c=>(c.priceMul||1)*((c.nightT>.5&&!c.festOk)?.7:1),rate:c=>riders.length/36*c.price(c.G.active)+(c.passive||0),
 tick(c,dt){const t=c.simT;const wet=c.WX.name==='Monsoon'?1-.4*c.rainMul:1;
  kitchens.forEach(k=>{k.fans.forEach(f=>f.rotation.y+=dt*(k.cooking.length?9:2));k.glow.visible=k.cooking.length>0;k.cooking.forEach(o=>{o.cook-=dt/(c.cookMul||1);o.status='cooking'});const ready=k.cooking.filter(o=>o.cook<=0);ready.forEach(o=>{const r=riders.find(x=>!x.order&&x.home===k);if(!r)return;k.cooking.splice(k.cooking.indexOf(o),1);o.status='picked up';o.rider=r;r.order=o;r.pts=route(k.door,o.dest.door);r.i=1;r.paused=false;r.onEnd=null;r.status='moving';o.pick=t})});
  riders.forEach(r=>{if(!r.order){if(!r.paused&&r.i>=r.pts.length-1&&Math.hypot(r.pos.x-r.home.door[0],r.pos.y-r.home.door[1])<.5){r.paused=true}return}
    const o=r.order;if(o.status==='picked up'){o.status='on the way';r.g.userData.trail=1}
    const dest=o.dest.door;if(Math.hypot(r.pos.x-dest[0],r.pos.y-dest[1])<.6&&o.status==='on the way'){o.status='delivered';delivered++;ordersH++;sumTime+=t-o.t0;c.burst(r.g,10,2,3);c.earn(Math.round(c.price(c.G.active)),r.g);if(o.pin){o.pin.visible=false;o.pin=null}c.log('ok',`#${o.id} delivered · ${o.dish}`);r.done++;r.order=null;r.pts=route(dest,r.home.door);r.i=1;r.dir=1;r.paused=false}
    if(Math.random()<dt*2.5&&r.status==='moving')c.burst(r.g,1,.2,.4)});
  if(Math.random()<dt*(.28+.04*riders.length)*wet&&orders.filter(o=>o.status!=='delivered').length<riders.length+3){const dest=buildings[Math.floor(Math.random()*buildings.length)];const k=kitchens.reduce((a,b)=>Math.hypot(b.door[0]-dest.door[0],b.door[1]-dest.door[1])<Math.hypot(a.door[0]-dest.door[0],a.door[1]-dest.door[1])?b:a);const pin=pins.find(p=>!p.visible);const o={id:orderSeq++,dish:DISHES[Math.floor(Math.random()*8)],total:Math.round(c.price(c.G.active)*rnd(.9,1.6)),km:Math.hypot(k.door[0]-dest.door[0],k.door[1]-dest.door[1])/22,dest,k,status:'accepted',cook:6,t0:t,pin};if(pin){pin.visible=true;pin.position.set(dest.pos.x,dest.pos.y*2+3,dest.pos.z)}orders.push(o);if(orders.length>40)orders.shift();k.cooking.push(o);k.today++;dest.orders++}
  pins.forEach((p,i)=>{if(p.visible)p.position.y+=Math.sin(t*4+i)*.01;p.rotation.y+=dt*2});
  lights.forEach(L=>{L.t+=dt;const red=(L.t%12)<6;L.r.visible=red;L.gr.visible=!red;if(red){for(const a of c.agents){if(a.lane!=='street'||a.order!==undefined)continue;const d=Math.hypot(a.pos.x-L.x,a.pos.y-L.z);if(d<4.5&&d>3&&a.dwell<=0&&Math.random()<dt*4){a.dwell=1.5;a.dwellStatus='at red'}}}})},
 slow(c){ordersH*=.98;const oh=Math.round(ordersH*30);c.kpi(0,`${oh}<small>/h</small>`,`${orders.filter(o=>o.status!=='delivered').length} open orders`,oh<20?'warn':'');c.spark(0,oh);const avg=delivered?sumTime/delivered:0;c.kpi(1,`${avg.toFixed(0)}<small>min</small>`,'promise 30 min',avg>40?'bad':avg>30?'warn':'');c.spark(1,avg);c.kpi(2,`${riders.length}<small>/ ${riders.length}</small>`,`${riders.filter(r=>r.order).length} on delivery`,'');c.spark(2,riders.filter(r=>r.order).length)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;if(a.order!==undefined)return{type:'Scooter rider · '+a.home.name,status:a.order?a.order.status:'idle at kitchen',level:a.status==='yielding'?'warn':'',stats:[['Order',a.order?'#'+a.order.id:'—'],['Dish',a.order?a.order.dish:'—'],['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Delivered',a.done]]};return{type:a.sub,status:a.status,stats:[['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Trips',Math.floor(a.trips)]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.cooking)return{type:s.type,status:s.cooking.length?'cooking':'idle',stats:[['Cooking now',s.cooking.length],['Orders today',s.today],['Riders home',riders.filter(r=>r.home===s).length],['Woks','6']],bar:Math.min(100,s.cooking.length/6*100)};
  if(s.orders!==undefined)return{type:s.type,status:'open',stats:[['Orders today',s.orders],['Last dish',orders.filter(o=>o.dest===s).slice(-1)[0]?.dish||'—'],['Distance to kitchen',(Math.hypot(s.door[0]-kitchens[0].door[0],s.door[1]-kitchens[0].door[1])/22).toFixed(1)+' km']]};
  return{type:s.type,status:'open',stats:[['Footfall','high']]}}
});
