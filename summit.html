createWorld({
 id:'summit',num:13,name:'Summit',tag:'Ski resort mountain ops',site:'Auli ridge · 2,900 m',accent:'#2563EB',accentRgb:'37,99,235',accentInk:'#1e40af',

 build(c){const {box,cyl,sph,M,world,stencil,lane,contact,tree,addStation,addAgent}=c;
  // mountain: heightfield plane
  const geo=new THREE.PlaneGeometry(160,150,48,44);geo.rotateX(-Math.PI/2);const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){pos.setY(i,hY(pos.getX(i),pos.getZ(i)-6)+Math.sin(pos.getX(i)*.3)*.4)}geo.computeVertexNormals();
  const mtn=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xf7f9fc,roughness:1,flatShading:true}));mtn.position.z=6;mtn.receiveShadow=true;mtn.castShadow=true;world.add(mtn);
  const rock=new THREE.Mesh(new THREE.ConeGeometry(9,14,7),new THREE.MeshStandardMaterial({color:0x8b93a3,roughness:1,flatShading:true}));rock.position.set(0,hY(0,-34)+2,-34);rock.castShadow=true;world.add(rock);
  // runs: polylines down the face, built from short slabs
  const mkRun=(id,name,grade,col,pts,len)=>{const g=new THREE.Group();world.add(g);const stripes=[];const edgeMat=new THREE.MeshStandardMaterial({color:col,roughness:.8});for(let i=0;i<pts.length-1;i++){const [x0,z0]=pts[i],[x1,z1]=pts[i+1];const y0=hY(x0,z0)+.15,y1=hY(x1,z1)+.15;const n=6;for(let k=0;k<n;k++){const f=k/n,f2=(k+1)/n;const a=new THREE.Vector3(lerp(x0,x1,f),lerp(y0,y1,f),lerp(z0,z1,f)),b=new THREE.Vector3(lerp(x0,x1,f2),lerp(y0,y1,f2),lerp(z0,z1,f2));const m=new THREE.Mesh(new THREE.BoxGeometry(a.distanceTo(b)+.3,.25,6),new THREE.MeshStandardMaterial({color:0xd3e0ef,roughness:.95}));m.position.copy(a).lerp(b,.5);m.lookAt(b);m.rotateY(Math.PI/2);m.receiveShadow=true;g.add(m);stripes.push(m);for(const side of[-1,1]){const e=new THREE.Mesh(new THREE.BoxGeometry(a.distanceTo(b)+.3,.3,.35),edgeMat);e.position.copy(m.position);e.rotation.copy(m.rotation);e.translateZ(side*2.9);e.position.y+=.05;g.add(e)}}
      const mk=box(g,.3,1.6,.3,new THREE.MeshStandardMaterial({color:col}),x0+3.5,y0,z0);}
    const r=addStation({id,name,type:`${grade} run · ${len} m`,grade,len,obj:g,pos:new THREE.Vector3(pts[1][0],hY(pts[1][0],pts[1][1])+2,pts[1][1]),pts,stripes,groom:rnd(.5,1),closed:false,col});runs.push(r);return r};
  mkRun('r1','Bluebird','blue',0x2563EB,[[0,-30],[-6,-14],[-4,4],[-2,20],[0,32]],1800);mkRun('r2','Devil\'s Elbow','black',0x111827,[[2,-30],[14,-18],[22,-4],[16,12],[6,30]],1500);mkRun('r3','Back bowl','red',0xef4444,[[4,-30],[26,-20],[36,-6],[30,12],[12,30]],2100);mkRun('r4','Terrain park','green',0x16a34a,[[-2,-30],[-20,-16],[-32,2],[-24,18],[-6,32]],1600);
  stencil('ZONE 04 BACK BOWL',30,-4,12,0,'#9aa3b2');stencil('ZONE 05 TERRAIN PARK',-30,8,14,0,'#9aa3b2');
  // lifts: chairlift (base→summit) and gondola (base→bowl)
  const mkLift=(id,name,type2,from,to,n,cabin,cap)=>{const g=new THREE.Group();world.add(g);const A=new THREE.Vector3(from[0],hY(from[0],from[1]),from[1]),B=new THREE.Vector3(to[0],hY(to[0],to[1]),to[1]);const L=A.distanceTo(B);const towers=7;for(let i=0;i<=towers;i++){const f=i/towers;const p=A.clone().lerp(B,f);const h=8;const tw=cyl(g,.35,.5,h,M.mid,p.x,p.y,p.z,8);box(g,4,.4,.4,M.mid,p.x,p.y+h,p.z)}
    const cable=new THREE.Mesh(new THREE.BoxGeometry(L,.08,.08),M.dark);cable.position.copy(A).lerp(B,.5).add(new THREE.Vector3(0,8.4,0));cable.lookAt(B.clone().add(new THREE.Vector3(0,8.4,0)));cable.rotateY(Math.PI/2);g.add(cable);const cable2=cable.clone();cable2.position.x+=0;g.add(cable2);
    const cars=[];for(let i=0;i<n;i++){const cg=new THREE.Group();g.add(cg);if(cabin){box(cg,1.8,2,1.6,M.white,0,-2.4,0);box(cg,1.9,.3,1.7,M.acc,0,-.6,0);box(cg,1.6,.9,.1,M.glass,0,-1.8,.85,{shadow:false})}else{box(cg,2.4,.3,.8,M.acc,0,-2,0);box(cg,2.4,1,.15,M.acc,0,-1.9,-.4);box(cg,.1,2,.1,M.dark,0,-2,0)}cars.push({g:cg,t:i/n})}
    for(const p of[A,B]){box(g,6,4,6,M.wall,p.x,p.y,p.z);box(g,6.4,.4,6.4,M.acc,p.x,p.y+4,p.z)}
    const l=addStation({id,name,type:type2,type2,obj:g,pos:A.clone().lerp(B,.5).add(new THREE.Vector3(0,6,0)),A,B,L,cars,speed:3.2,cap,hold:false});lifts.push(l);return l};
  mkLift('l1','Summit Express','Detachable quad',[-8,34],[-4,-30],14,false,2400);mkLift('l2','Bowl Gondola','8-cabin gondola',[12,34],[30,-16],8,true,1800);stencil('ZONE 03 MAIN LIFT',-14,2,12,0,'#9aa3b2');
  // base village: chalets, lodge, patrol hut, parking, snow cannons, pines
  const chalet=(x,z,w,d,h)=>{const g=new THREE.Group();g.position.set(x,hY(x,z),z);world.add(g);box(g,w,h,d,new THREE.MeshStandardMaterial({color:0x8a5a3c,roughness:1}),0,0,0);const roof=box(g,w+1,.6,d+1,M.white,0,h,0);const r2=box(g,w*.72,1.6,d+1.2,M.white,0,h+.5,0);r2.rotation.z=Math.PI/4;r2.scale.y=.6;for(let k=-w/2+1.2;k<w/2-.8;k+=2){const win=box(g,1,.9,.15,M.window,k,1,d/2+.05,{shadow:false});win.userData.win=1}return g};
  for(const [x,z] of[[-16,42],[-8,46],[10,46],[18,42],[-22,36]])chalet(x,z,5,4,3);
  {const g=chalet(0,42,14,8,5);box(g,16,.4,6,M.floor,0,0,7);for(let k=-6;k<=6;k+=3){cyl(g,.9,.9,.1,M.acc,k,.5,7,8);cyl(g,.06,.06,.5,M.dark,k,0,7,6)}lodge=addStation({id:'lodge',name:'Summit Lodge',type:'Terrace · 180 covers',obj:g,pos:new THREE.Vector3(0,3,42)});stencil('ZONE 01 BASE VILLAGE',0,52,16,0,'#9aa3b2')}
  {const g=new THREE.Group();g.position.set(6,hY(6,-28),-28);world.add(g);box(g,4,3,3,M.white,0,0,0);box(g,4.4,.3,3.4,M.acc,0,3,0);box(g,1,1,.2,new THREE.MeshStandardMaterial({color:0xef4444}),0,1.2,1.6,{shadow:false});addStation({id:'hut',name:'Ski patrol hut',type:'Summit station · 4 patrollers',obj:g,pos:new THREE.Vector3(6,hY(6,-28)+2,-28)});stencil('ZONE 02 SUMMIT · 2,900 m',0,-24,16,0,'#9aa3b2')}
  box(world,30,.2,10,M.asphalt,0,-.1,60);for(let i=0;i<8;i++)box(world,3,.05,2,M.lane,-12+i*3.4,.12,58,{shadow:false});
  c.addCannon=()=>{const i=cannons.length;const r=runs[i%4];const [x,z]=r.pts[1+(i%3)];const g=new THREE.Group();g.position.set(x+4,hY(x+4,z),z);world.add(g);box(g,.8,.8,.8,M.dark,0,0,0);const gun=cyl(g,.25,.4,2.2,M.yellow,0,.8,0,8);gun.rotation.z=-.9;cannons.push({g,gun,on:true})};for(let i=0;i<3;i++)c.addCannon();
  for(let i=0;i<60;i++){const x=rnd(-78,78),z=rnd(-60,70);if(Math.abs(x)<40&&z<36&&z>-34)continue;const g=new THREE.Group();g.position.set(x,hY(x,z),z);world.add(g);const h=rnd(3,6);const cone=new THREE.Mesh(new THREE.ConeGeometry(h*.35,h,7),new THREE.MeshStandardMaterial({color:0x2f6b4a,roughness:1,flatShading:true}));cone.position.y=h/2+.4;cone.castShadow=true;g.add(cone);const cap=new THREE.Mesh(new THREE.ConeGeometry(h*.2,h*.4,7),M.white);cap.position.y=h*.85;g.add(cap)}
  // skiers
  c.addSkier=()=>{const g=new THREE.Group();world.add(g);box(g,.5,1,.4,[M.acc,new THREE.MeshStandardMaterial({color:0xef4444}),M.yellow,M.white][skiers.length%4],0,.4,0);sph(g,.22,M.dark,0,1.6,0);box(g,1.6,.06,.2,M.dark,0,0,-.2);box(g,1.6,.06,.2,M.dark,0,0,.2);const s={g,run:runs[skiers.length%4],t:Math.random(),state:'down',lat:rnd(-2,2),speed:rnd(.05,.09),wait:0};skiers.push(s);return s};for(let i=0;i<24;i++)c.addSkier();
  // snowcat + patrol snowmobile
  {const g=new THREE.Group();world.add(g);box(g,3.4,1.6,2.6,new THREE.MeshStandardMaterial({color:0xef4444}),0,.6,0);box(g,1.6,1.2,2.2,M.glass,-.4,2.2,0,{shadow:false});box(g,4,.6,.8,M.dark,0,0,-1.5);box(g,4,.6,.8,M.dark,0,0,1.5);box(g,.4,1.6,3.6,M.yellow,2,.4,0);snowcat=addAgent({id:'cat',name:'Snowcat PB-600',sub:'Grooming',g,pts:[[0,32],[-2,20],[-4,4],[-6,-14]],maxSpeed:3,lane:'snow',loop:false});snowcat.y3=true}
  {const g=new THREE.Group();world.add(g);box(g,2.2,.8,1,M.yellow,0,.5,0);box(g,.5,.9,.5,new THREE.MeshStandardMaterial({color:0xef4444}),-.3,1.1,0);patrol=addAgent({id:'sled',name:'Patrol sled 2',sub:'Standby at hut',g,pts:[[6,-28],[6,-28]],maxSpeed:6,lane:'snow',loop:false});patrol.paused=true}
  c.liftPos=(l,t)=>{const f=t<.5?t*2:1-(t-.5)*2;const p=l.A.clone().lerp(l.B,f);p.y+=8.4-Math.sin(f*Math.PI)*1.2;p.x+=t<.5?1.2:-1.2;return p};
 },
 apply(c){const u=c.G.up;c.passive=45*u.lodge;c.nightOk=!!u.night;c.groomMul=1-.3*Math.min(1,u.groom);c.patrolMul=1-.4*Math.min(1,u.patrolx);c.liftMul=1+.15*u.gondola;while(skiers.length<24+4*u.chair)c.addSkier();while(cannons.length<3+2*u.snow)c.addCannon();lifts.forEach(l=>l.speed=3.2*c.liftMul)},
 priceMul:c=>(c.nightT>.5&&!c.nightOk)?.5:1,rate:c=>skiers.length/43*c.price(c.G.active)*(c.liftMul||1)+(c.passive||0),
 tick(c,dt){const t=c.simT;const white=c.WX.name==='Whiteout';lifts.forEach(l=>{l.hold=white;if(!l.hold)l.cars.forEach(k=>{k.t=(k.t+dt*l.speed/l.L/2)%1;k.g.position.copy(c.liftPos(l,k.t))})});
  newSnow=clamp(newSnow+dt*(c.WX.name==='Snowfall'?.02:c.WX.name==='Spring slush'?-.01:-.002)+cannons.filter(k=>k.on).length*dt*.0015,0,60);
  cannons.forEach(k=>{k.on=c.WX.name!=='Spring slush'&&c.nightT>.3;if(k.on&&Math.random()<dt*8)c.burst(k.gun,2,1,3)});
  runs.forEach(r=>{r.groom=clamp(r.groom-dt*.0006*skiers.filter(s=>s.run===r).length,0,1);r.closed=r.groom<.15||(white&&r.grade==='black');r.stripes.forEach((m,i)=>m.material.color.setHex(0xd3e0ef).lerp(C_ROUGH,(1-r.groom)*((i%2)?.7:.25)))});
  // snowcat grooms the roughest run
  if(snowcat.i>=snowcat.pts.length-1&&snowcat.status!=='moving'||snowcat.trips>=1&&!snowcat.target){const r=runs.slice().sort((a,b)=>a.groom-b.groom)[0];snowcat.target=r;snowcat.pts=r.pts.slice().reverse();snowcat.i=1;snowcat.dir=1;snowcat.trips=0;snowcat.sub='Grooming '+r.name;snowcat.paused=false}
  if(snowcat.target){snowcat.target.groom=clamp(snowcat.target.groom+dt*.06/(c.groomMul||1),0,1);if(Math.random()<dt*6)c.burst(snowcat.g,1,.5,.5);if(snowcat.i>=snowcat.pts.length-1&&Math.hypot(snowcat.pos.x-snowcat.pts.at(-1)[0],snowcat.pos.y-snowcat.pts.at(-1)[1])<.8)snowcat.target=null}
  c.agents.forEach(a=>{a.g.position.y=hY(a.pos.x,a.pos.y)+.2});
  // skiers: carve down, queue, ride up
  let onMtn=0,q=0;for(const s of skiers){if(s.state==='down'){onMtn++;s.t+=dt*s.speed*(s.run.closed?0:1)*(c.WX.name==='Spring slush'?.7:1);if(s.run.closed){s.run=runs.find(r=>!r.closed)||s.run}const pts=s.run.pts;const u=Math.min(.999,s.t)*(pts.length-1);const i=Math.floor(u),f=u-i;const x=lerp(pts[i][0],pts[i+1][0],f)+Math.sin(s.t*18+s.lat)*2,z=lerp(pts[i][1],pts[i+1][1],f);s.g.position.set(x,hY(x,z)+.2,z);s.g.rotation.y=Math.atan2(-(pts[i+1][1]-pts[i][1]),pts[i+1][0]-pts[i][0])+Math.cos(s.t*18+s.lat)*.6;if(s.t>=1){s.state='queue';s.wait=0;s.qi=queue;s.g.position.set(-8+(s.qi%6)*1.1-3,hY(-8,34)+.2,37+Math.floor(s.qi/6)*1.2)}if(!incident&&Math.random()<dt*.0015){incident={s,t:0};s.state='hurt';c.addAlert('bad',`Skier down on ${s.run.name}`,'Patrol sled dispatched',{kind:'station',id:s.run.id});patrol.pts=[[patrol.pos.x,patrol.pos.y],[s.g.position.x,s.g.position.z]];patrol.i=1;patrol.dir=1;patrol.paused=false;patrol.sub='Responding'}}
    else if(s.state==='queue'){q++;s.wait+=dt;if(s.wait>waitT*(white?3:1)&&!white){s.state='up';s.lift=lifts[Math.random()<.65?0:1];s.t=0;c.earn(Math.round(c.price(c.G.active)),s.g);rides++;s.g.visible=false}}
    else if(s.state==='up'){s.t+=dt*s.lift.speed/s.lift.L/2;if(s.t>=.5){s.state='down';s.t=0;s.run=s.lift===lifts[1]?runs[2]:runs[Math.floor(Math.random()*4)];if(s.run.closed)s.run=runs[0];s.g.visible=true}}
    else if(s.state==='hurt'){incident.t+=dt;if(Math.hypot(patrol.pos.x-s.g.position.x,patrol.pos.y-s.g.position.z)<1.5&&patrol.dwell<=0&&!patrol.treating){patrol.treating=true;patrol.dwell=6*(c.patrolMul||1);patrol.dwellStatus='treating'}if(patrol.treating&&patrol.dwell<=0){patrol.treating=false;incident=null;s.state='queue';s.wait=0;s.g.position.set(-8,hY(-8,34)+.2,36);patrol.pts=[[patrol.pos.x,patrol.pos.y],[6,-28]];patrol.i=1;patrol.dir=1;patrol.sub='Standby at hut';c.addAlert('ok','Skier evacuated','Minor injury · back at base')}}}
  queue=q;waitT=lerp(waitT,2+q*.35/(c.liftMul||1),dt)},
 slow(c){const on=skiers.filter(s=>s.state!=='queue').length;c.kpi(0,`${on}<small>/ ${skiers.length}</small>`,`${runs.filter(r=>!r.closed).length} of 4 runs open`,'');c.spark(0,on);c.kpi(1,`${waitT.toFixed(0)}<small>min</small>`,`${queue} in the lift line`,waitT>10?'bad':waitT>6?'warn':'');c.spark(1,waitT);c.kpi(2,`${newSnow.toFixed(0)}<small>cm</small>`,`${cannons.filter(k=>k.on).length} cannons spraying · ${c.WX.name}`,newSnow<2?'warn':'');c.spark(2,newSnow)},
 detail(c,d){if(d.kind==='agent'){const a=d.agent;return{type:a.sub,status:a.status,stats:[['Task',a.sub],['Speed',(a.speed*3.6).toFixed(0)+' km/h'],['Trips',Math.floor(a.trips)]]}}
  const s=c.stations.find(x=>x.id===d.id);if(!s)return{};if(s.cars)return{type:s.type2,status:s.hold?'on hold · wind':'running',level:s.hold?'warn':'',stats:[['Capacity',s.cap+' /h'],['Speed',(s.speed*3.6).toFixed(1)+' km/h'],['Ride time',(s.L/s.speed).toFixed(0)+' s'],['Queue',queue]]};
  if(s.stripes)return{type:s.type,status:s.closed?'closed':'open',level:s.closed?'bad':s.groom<.4?'warn':'',stats:[['Grade',s.grade],['Groomed',Math.round(s.groom*100)+' %'],['Skiers on run',skiers.filter(k=>k.run===s&&k.state==='down').length],['Snow depth',(80+newSnow).toFixed(0)+' cm']],bar:s.groom*100};
  if(s.id==='lodge')return{type:s.type,status:'open',stats:[['Covers today',Math.round(rides*.4)],['Terrace',c.nightT>.5?'heaters on':'sunny'],['Income',(45*c.G.up.lodge)+' ⚡/s']]};
  return{type:s.type,status:'open',stats:[['Temp',c.WX.temp+' °C'],['Rides today',rides]]}}
});
</script></body></html>
